<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">当前真实任务主链、双层闭环与同研究边界</title>
  <desc id="desc">乳腺癌科研数据智能体从科研问题、研究约束、规划、受限采集、数据集构建、身份审计到四层质量门和诚实输出的当前默认流程。图中同时区分独立接口，并以 GSE76360 和其他研究的 cBioPortal 分子数据说明禁止跨研究患者级拼接。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.09" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="layer"/>
      <feMerge><feMergeNode in="layer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGray" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#7C3AED"/>
    </marker>
    <style>
      .zh { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 40px; font-weight: 800; fill: #0F172A; letter-spacing: 0.5px; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #475569; }
      .section { font-size: 18px; font-weight: 800; }
      .cardTitle { font-size: 20px; font-weight: 800; fill: #0F172A; }
      .cardBody { font-size: 15px; font-weight: 500; fill: #475569; }
      .small { font-size: 14px; font-weight: 500; fill: #64748B; }
      .tiny { font-size: 13px; font-weight: 500; fill: #64748B; }
      .num { font-size: 16px; font-weight: 800; fill: #FFFFFF; }
      .gateTitle { font-size: 18px; font-weight: 800; fill: #0F172A; }
      .gateBody { font-size: 14px; font-weight: 600; fill: #475569; }
      .mainCard { fill: #FFFFFF; stroke: #93C5FD; stroke-width: 2; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGray); }
      .innerLoop { fill: none; stroke: #0F766E; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
      .outerLoop { fill: none; stroke: #2563EB; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .independent { fill: none; stroke: #7C3AED; stroke-width: 2.4; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; }
      .independentArrow { fill: none; stroke: #7C3AED; stroke-width: 2.4; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#pageBg)"/>
  <circle cx="1835" cy="55" r="160" fill="#DBEAFE" opacity="0.55"/>
  <circle cx="50" cy="1040" r="180" fill="#CCFBF1" opacity="0.28"/>

  <g class="zh">
    <text x="48" y="55" class="title">当前真实任务流程｜双层闭环、来源分工与同研究边界</text>
    <text x="50" y="90" class="subtitle">实线是默认任务链；紫色虚线是可独立调用但不自动串入的接口；红色 T 型线表示代码明确禁止的患者级连接</text>

    <!-- Section A -->
    <rect x="48" y="110" width="195" height="30" rx="15" fill="#DBEAFE"/>
    <text x="146" y="131" text-anchor="middle" class="section" fill="#1D4ED8">A｜默认任务主链</text>

    <!-- Outer closed-loop line: quality decision back to planner -->
    <path d="M1745 148 V120 H675 V146" class="outerLoop"/>
    <rect x="975" y="104" width="560" height="31" rx="15" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="1255" y="125" text-anchor="middle" font-size="15" font-weight="800" fill="#1D4ED8">外层 ClosedLoop / Critic：诊断缺口 → 安全改写检索输入 → 重跑任务</text>

    <!-- Main chain cards -->
    <g filter="url(#shadow)">
      <rect x="45" y="152" width="220" height="140" rx="18" class="mainCard"/>
      <rect x="290" y="152" width="240" height="140" rx="18" class="mainCard"/>
      <rect x="555" y="152" width="230" height="140" rx="18" class="mainCard" stroke="#C4B5FD"/>
      <rect x="810" y="152" width="250" height="140" rx="18" class="mainCard" stroke="#5EEAD4"/>
      <rect x="1085" y="152" width="240" height="140" rx="18" class="mainCard" stroke="#5EEAD4"/>
      <rect x="1350" y="152" width="240" height="140" rx="18" class="mainCard" stroke="#67E8F9"/>
      <rect x="1615" y="152" width="260" height="140" rx="18" class="mainCard" stroke="#FDBA74"/>
    </g>

    <g>
      <circle cx="72" cy="180" r="17" fill="#2563EB"/><text x="72" y="186" text-anchor="middle" class="num">1</text>
      <text x="101" y="187" class="cardTitle">输入科研问题</text>
      <text x="69" y="222" class="cardBody">疾病 · 人群 · 暴露/治疗</text>
      <text x="69" y="247" class="cardBody">结局 · 目标字段 · 数据粒度</text>
      <text x="69" y="272" class="small">自然语言或高级筛选</text>

      <circle cx="317" cy="180" r="17" fill="#2563EB"/><text x="317" y="186" text-anchor="middle" class="num">2</text>
      <text x="346" y="187" class="cardTitle">冻结 ResearchSpec</text>
      <text x="314" y="222" class="cardBody">解析研究问题与必需字段</text>
      <text x="314" y="247" class="cardBody">保留研究边界与响应域</text>
      <text x="314" y="272" class="small">不把规划文本当作数据</text>

      <circle cx="582" cy="180" r="17" fill="#7C3AED"/><text x="582" y="186" text-anchor="middle" class="num">3</text>
      <text x="611" y="187" class="cardTitle">Planner / Router</text>
      <text x="579" y="222" class="cardBody">选择已注册真实 Adapter</text>
      <text x="579" y="247" class="cardBody">千问规划或确定性兜底</text>
      <text x="579" y="272" class="small">按来源角色分流</text>

      <circle cx="837" cy="180" r="17" fill="#0F766E"/><text x="837" y="186" text-anchor="middle" class="num">4</text>
      <text x="866" y="187" class="cardTitle">CollectionAgent</text>
      <text x="834" y="222" class="cardBody">执行工具调用并登记来源</text>
      <text x="834" y="247" class="cardBody">诊断当前缺口，换未试方法</text>
      <text x="834" y="272" class="small">只补采缺口，不改医学事实</text>

      <circle cx="1112" cy="180" r="17" fill="#0F766E"/><text x="1112" y="186" text-anchor="middle" class="num">5</text>
      <text x="1141" y="187" class="cardTitle">Dataset Builder</text>
      <text x="1109" y="222" class="cardBody">选择一张 primary 主表</text>
      <text x="1109" y="247" class="cardBody">其他研究保留 companion 表</text>
      <text x="1109" y="272" class="small">不自动补齐跨研究患者字段</text>

      <circle cx="1377" cy="180" r="17" fill="#0891B2"/><text x="1377" y="186" text-anchor="middle" class="num">6</text>
      <text x="1406" y="187" class="cardTitle">身份边界审计</text>
      <text x="1374" y="222" class="cardBody">DataAlignmentAuditor</text>
      <text x="1374" y="247" class="cardBody">研究 / 患者 / 样本命名空间</text>
      <text x="1374" y="272" class="small">输出 MATCH 或 REVIEW</text>

      <circle cx="1642" cy="180" r="17" fill="#D97706"/><text x="1642" y="186" text-anchor="middle" class="num">7</text>
      <text x="1671" y="187" class="cardTitle">四层 Quality Gate</text>
      <text x="1639" y="222" class="cardBody">来源 → 覆盖 → 身份 → 适用性</text>
      <text x="1639" y="247" class="cardBody">阈值见下方 G1–G4</text>
      <text x="1639" y="272" class="small">门未过即保留缺口</text>
    </g>

    <path d="M265 222 H282" class="flow"/>
    <path d="M530 222 H547" class="flow"/>
    <path d="M785 222 H802" class="flow"/>
    <path d="M1060 222 H1077" class="flow"/>
    <path d="M1325 222 H1342" class="flow"/>
    <path d="M1590 222 H1607" class="flow"/>

    <!-- Inner collection loop -->
    <path d="M1205 292 V327 H935 V298" class="innerLoop"/>
    <rect x="952" y="303" width="236" height="38" rx="18" fill="#ECFDF5" stroke="#5EEAD4"/>
    <text x="1070" y="327" text-anchor="middle" font-size="14" font-weight="800" fill="#0F766E">内层：检查缺口 → 补采 → 重建</text>

    <!-- Source routing arrows -->
    <path d="M725 370 V346 H935 V298" class="innerLoop"/>
    <path d="M900 370 V351 H670 V298" class="outerLoop"/>

    <!-- Section B: source routing -->
    <rect x="45" y="370" width="950" height="250" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="45" y="370" width="950" height="44" rx="22" fill="#0F766E"/>
    <path d="M45 392 Q45 414 67 414 H973 Q995 414 995 392 V414 H45 Z" fill="#0F766E"/>
    <text x="70" y="399" font-size="19" font-weight="800" fill="#FFFFFF">B｜来源角色路由：同一“找到”不等于同一“进入主表”</text>
    <text x="970" y="399" text-anchor="end" font-size="14" font-weight="700" fill="#CCFBF1">角色先分清，再决定是否建模</text>

    <text x="70" y="445" class="section" fill="#0F766E">默认可解析主数据候选</text>
    <g>
      <rect x="70" y="461" width="205" height="96" rx="14" fill="#ECFEFF" stroke="#5EEAD4"/>
      <text x="88" y="489" class="gateTitle">GEO</text>
      <text x="88" y="516" class="gateBody">患者/样本元数据、响应队列</text>
      <text x="88" y="540" class="tiny">例：GSE Series Matrix</text>

      <rect x="290" y="461" width="205" height="96" rx="14" fill="#ECFEFF" stroke="#5EEAD4"/>
      <text x="308" y="489" class="gateTitle">cBioPortal</text>
      <text x="308" y="516" class="gateBody">分子与临床数据</text>
      <text x="308" y="540" class="tiny">异研究时仅作 companion</text>

      <rect x="510" y="461" width="205" height="96" rx="14" fill="#ECFEFF" stroke="#5EEAD4"/>
      <text x="528" y="489" class="gateTitle">DepMap</text>
      <text x="528" y="516" class="gateBody">细胞系资料</text>
      <text x="528" y="540" class="tiny">response_domain 与患者分离</text>
    </g>

    <rect x="740" y="435" width="230" height="129" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="760" y="464" class="gateTitle" fill="#1D4ED8">默认候选 / 证据来源</text>
    <text x="760" y="490" class="gateBody">GDC · ClinicalTrials / AACT</text>
    <text x="760" y="514" class="gateBody">CIViC · Europe PMC · BioSample</text>
    <text x="760" y="540" class="tiny" fill="#1D4ED8">已注册 Adapter；按任务选择调用</text>
    <text x="760" y="558" class="tiny" fill="#1D4ED8">用于候选/试验/证据，不自动写主表</text>

    <rect x="70" y="574" width="900" height="28" rx="14" fill="#F0FDFA"/>
    <text x="520" y="594" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">同研究且身份可核验的数据才可进入患者级矩阵；其他来源保持独立表、来源项或缺口线索</text>

    <!-- Section C: concrete anti-join example -->
    <rect x="1020" y="370" width="855" height="250" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1020" y="370" width="855" height="44" rx="22" fill="#2563EB"/>
    <path d="M1020 392 Q1020 414 1042 414 H1853 Q1875 414 1875 392 V414 H1020 Z" fill="#2563EB"/>
    <text x="1045" y="399" font-size="19" font-weight="800" fill="#FFFFFF">C｜真实任务中的同研究边界</text>
    <text x="1850" y="399" text-anchor="end" font-size="14" font-weight="700" fill="#DBEAFE">实测 primary 与 companion 分开，不跨研究拼患者</text>

    <rect x="1048" y="438" width="330" height="122" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="1068" y="466" class="gateTitle" fill="#1D4ED8">primary｜breast_alpelisib_2020</text>
    <text x="1068" y="491" class="gateBody">115 行；42 位患者</text>
    <text x="1068" y="516" class="gateBody">含 PIK3CA + 治疗响应</text>
    <text x="1068" y="541" class="tiny">页面亚型 HR+ / HER2− → G4 REVIEW</text>

    <rect x="1518" y="438" width="329" height="122" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="1538" y="463" class="gateTitle" fill="#B45309">GSE76360｜companion</text>
    <text x="1538" y="486" class="tiny">50 行；48 有响应；缺同患者 PIK3CA</text>
    <line x1="1538" y1="499" x2="1827" y2="499" stroke="#FED7AA" stroke-width="2"/>
    <text x="1538" y="524" class="gateTitle" fill="#B45309">METABRIC / TCGA｜companion</text>
    <text x="1538" y="547" class="tiny">其他研究资料；保持独立，不反填 primary</text>

    <!-- Prohibited cross-study join: red line with T-bar -->
    <path d="M1518 500 H1398" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="1398" y1="478" x2="1398" y2="522" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    <text x="1457" y="466" text-anchor="middle" font-size="12" font-weight="800" fill="#DC2626">禁止跨研究</text>
    <text x="1457" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#DC2626">患者级 Join</text>
    <path d="M1398 522 V572" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="1065" y="571" width="760" height="31" rx="15" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="1445" y="592" text-anchor="middle" font-size="13" font-weight="800" fill="#DC2626">→ REVIEW：primary 亚型不匹配；所有 companion 独立保留，不拼成“同患者证据”</text>

    <!-- Section D: four code-true gates -->
    <rect x="45" y="650" width="1210" height="300" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="45" y="650" width="1210" height="45" rx="22" fill="#D97706"/>
    <path d="M45 672 Q45 695 68 695 H1232 Q1255 695 1255 672 V695 H45 Z" fill="#D97706"/>
    <text x="70" y="680" font-size="19" font-weight="800" fill="#FFFFFF">D｜代码实际执行的四层质量门</text>
    <text x="1230" y="680" text-anchor="end" font-size="14" font-weight="700" fill="#FFEDD5">门槛值，不是展示分或主观打分</text>

    <g>
      <rect x="68" y="718" width="270" height="191" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
      <rect x="68" y="718" width="270" height="38" rx="16" fill="#DBEAFE"/>
      <text x="203" y="744" text-anchor="middle" class="gateTitle" fill="#1D4ED8">G1｜来源可信</text>
      <text x="88" y="784" class="gateBody">• source_id + 官方 URL</text>
      <text x="88" y="813" class="gateBody">• accession 或 checksum 可核验</text>
      <text x="88" y="842" class="gateBody">• official host</text>
      <text x="88" y="876" class="small">缺一即进入来源审计 / REVIEW</text>

      <rect x="356" y="718" width="270" height="191" rx="16" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
      <rect x="356" y="718" width="270" height="38" rx="16" fill="#CFFAFE"/>
      <text x="491" y="744" text-anchor="middle" class="gateTitle" fill="#0E7490">G2｜主字段覆盖</text>
      <text x="376" y="790" class="gateBody">primary-field</text>
      <text x="376" y="822" class="gateBody">平均逐行覆盖率 ≥ 45%</text>
      <line x1="376" y1="843" x2="606" y2="843" stroke="#A5F3FC" stroke-width="2"/>
      <text x="376" y="876" class="small">按主表实际行计算，不用表存在代替覆盖</text>

      <rect x="644" y="718" width="270" height="191" rx="16" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/>
      <rect x="644" y="718" width="270" height="38" rx="16" fill="#CCFBF1"/>
      <text x="779" y="744" text-anchor="middle" class="gateTitle" fill="#0F766E">G3｜实体一致</text>
      <text x="664" y="784" class="gateBody">• DataAlignmentAuditor</text>
      <text x="664" y="813" class="gateBody">• identity = MATCH</text>
      <text x="664" y="842" class="gateBody">• same-study only</text>
      <text x="664" y="871" class="gateBody" fill="#DC2626">• no cross-source patient Join</text>

      <rect x="932" y="718" width="300" height="191" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
      <rect x="932" y="718" width="300" height="38" rx="16" fill="#FFEDD5"/>
      <text x="1082" y="744" text-anchor="middle" class="gateTitle" fill="#B45309">G4｜科研适用性</text>
      <text x="952" y="781" class="gateBody">• rows ≥ 30</text>
      <text x="952" y="807" class="gateBody">• outcome match ≥ 75%（需要时）</text>
      <text x="952" y="833" class="gateBody">• HER2 evidence ≥ 50%（需要时）</text>
      <text x="952" y="859" class="gateBody">• primary coverage ≥ 45%</text>
      <text x="952" y="889" class="tiny">仅对题目要求的目标触发条件门槛</text>
    </g>

    <!-- Section E: outer loop and honest outputs -->
    <rect x="1280" y="650" width="595" height="300" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1280" y="650" width="595" height="45" rx="22" fill="#2563EB"/>
    <path d="M1280 672 Q1280 695 1303 695 H1852 Q1875 695 1875 672 V695 H1280 Z" fill="#2563EB"/>
    <text x="1305" y="680" font-size="19" font-weight="800" fill="#FFFFFF">E｜外层闭环与诚实输出</text>

    <g>
      <rect x="1305" y="716" width="162" height="59" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="1386" y="741" text-anchor="middle" class="gateTitle">Critic 诊断</text>
      <text x="1386" y="762" text-anchor="middle" class="tiny">缺口 / 匹配 / 来源</text>
      <rect x="1491" y="716" width="170" height="59" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="1576" y="741" text-anchor="middle" class="gateTitle">安全修正输入</text>
      <text x="1576" y="762" text-anchor="middle" class="tiny">补字段 / 换未试来源</text>
      <rect x="1685" y="716" width="164" height="59" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="1767" y="741" text-anchor="middle" class="gateTitle">重新执行任务</text>
      <text x="1767" y="762" text-anchor="middle" class="tiny">比较任务内进展</text>
      <path d="M1467 746 H1483" class="flow"/>
      <path d="M1661 746 H1677" class="flow"/>
    </g>

    <rect x="1305" y="790" width="544" height="42" rx="14" fill="#DBEAFE"/>
    <text x="1577" y="808" text-anchor="middle" font-size="14" font-weight="800" fill="#1D4ED8">默认 max_iterations = 3；require_two_rounds = true</text>
    <text x="1577" y="826" text-anchor="middle" class="tiny">至少两轮复核；通过、无改进、重复输入、方法用尽或达上限时停止</text>

    <rect x="1305" y="846" width="124" height="42" rx="21" fill="#0F766E"/>
    <text x="1367" y="873" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">PASS</text>
    <rect x="1442" y="846" width="138" height="42" rx="21" fill="#D97706"/>
    <text x="1511" y="873" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">PARTIAL</text>
    <rect x="1593" y="846" width="124" height="42" rx="21" fill="#DC2626"/>
    <text x="1655" y="873" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">REVIEW</text>
    <rect x="1730" y="846" width="119" height="42" rx="21" fill="#E2E8F0" stroke="#94A3B8"/>
    <text x="1789" y="873" text-anchor="middle" font-size="14" font-weight="800" fill="#475569">空表+缺口</text>

    <text x="1307" y="906" class="small">PASS 仅表示当前任务达到探索性准入；不等于论文或临床发布。</text>
    <text x="1307" y="924" class="tiny">PARTIAL 保留已达目标；REVIEW 不自动合并；不可解析时返回空表+缺口。</text>
    <text x="1307" y="942" class="tiny">Critic 不改写医学事实，任务内 progress 也不作为 benchmark、Repair Accuracy 或 SDTI。</text>

    <!-- Legend and accuracy note -->
    <rect x="45" y="975" width="1830" height="78" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <text x="70" y="1005" font-size="17" font-weight="800" fill="#0F172A">图例</text>
    <path d="M130 1000 H205" class="flow"/>
    <text x="220" y="1006" class="small">默认主链 / 代码实际调用</text>
    <path d="M425 1000 H500" class="independentArrow"/>
    <text x="515" y="1006" class="small">独立接口，不表示每次任务都调用</text>
    <path d="M790 1000 H865" fill="none" stroke="#DC2626" stroke-width="4"/>
    <line x1="865" y1="987" x2="865" y2="1013" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    <text x="885" y="1006" class="small">禁止连接 / 保持研究边界</text>
    <rect x="1155" y="985" width="122" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="1216" y="1006" text-anchor="middle" class="small" fill="#B45309">条件阈值</text>
    <text x="1295" y="1006" class="small">“需要时”表示仅在题目要求对应目标时触发。</text>
    <text x="70" y="1036" class="tiny" fill="#64748B">能力边界：默认主链登记来源并保留可用的核心原值，但本图不宣称所有来源都已逐单元格生成 raw_field/raw_value、EvidenceCell 或自动 Repair。</text>
  </g>
</svg>
