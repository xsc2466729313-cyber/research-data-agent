version: "0.1"

thresholds:
  retrieval_precision: 0.90
  retrieval_recall: 0.90
  retrieval_f1: 0.90
  faithfulness: 0.95
  traceability_target: 1.00
  traceability_publish_minimum: 0.95
  error_f1: 0.90
  repair_accuracy: 0.90
  sdti_target: 90.0

safety_gates:
  fake_source_rate_max: 0.01
  faithfulness_min: 0.90
  traceability_min: 0.95

publishing:
  block_if_evidence_missing: true
  block_if_high_risk_unresolved: true
