<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#2563EB"/></marker><style>
  .title{font:700 42px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.sub{font:400 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.head{font:700 26px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.body{font:400 21px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.value{font:700 28px 'Microsoft YaHei','SimHei',sans-serif;fill:#1D4ED8}.white{font:700 25px 'Microsoft YaHei','SimHei',sans-serif;fill:#fff}.note{font:400 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#334155}
  </style></defs><rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="65" text-anchor="middle" class="title">代表任务：先确认研究条件，再解释实际取得的数据</text>
  <text x="800" y="104" text-anchor="middle" class="sub">条件决定要找什么，真实取数结果决定当前能够分析什么</text>
  <text x="100" y="166" class="head">研究条件</text>
  <g>
    <rect x="90" y="196" width="330" height="160" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/><text x="255" y="242" text-anchor="middle" class="head">研究对象</text><text x="255" y="290" text-anchor="middle" class="value">HER2 阳性乳腺癌</text><text x="255" y="327" text-anchor="middle" class="body">限定患者范围</text>
    <rect x="455" y="196" width="330" height="160" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/><text x="620" y="242" text-anchor="middle" class="head">分子变量</text><text x="620" y="290" text-anchor="middle" class="value">PIK3CA 突变</text><text x="620" y="327" text-anchor="middle" class="body">限定要观察的基因变化</text>
    <rect x="820" y="196" width="330" height="160" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/><text x="985" y="242" text-anchor="middle" class="head">治疗阶段</text><text x="985" y="290" text-anchor="middle" class="value">手术前治疗</text><text x="985" y="327" text-anchor="middle" class="body">限定治疗发生的时间</text>
    <rect x="1185" y="196" width="330" height="160" rx="24" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="3"/><text x="1350" y="242" text-anchor="middle" class="head">结果变量</text><text x="1350" y="290" text-anchor="middle" class="value">患者疗效</text><text x="1350" y="327" text-anchor="middle" class="body">限定最终分析结果</text>
  </g>
  <path d="M800 376 V438" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
  <text x="100" y="462" class="head">实际执行与数据产出</text>
  <g>
    <rect x="90" y="492" width="260" height="148" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/><text x="220" y="540" text-anchor="middle" class="value">2 轮</text><text x="220" y="584" text-anchor="middle" class="body">按缺项继续查找</text><text x="220" y="616" text-anchor="middle" class="body">而不是补写事实</text>
    <rect x="385" y="492" width="260" height="148" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/><text x="515" y="540" text-anchor="middle" class="value">6 / 6 次</text><text x="515" y="584" text-anchor="middle" class="body">真实工具调用成功</text><text x="515" y="616" text-anchor="middle" class="body">记录实际取数过程</text>
    <rect x="680" y="492" width="260" height="148" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/><text x="810" y="540" text-anchor="middle" class="value">50 条</text><text x="810" y="584" text-anchor="middle" class="body">来源记录</text><text x="810" y="616" text-anchor="middle" class="body">保留真实入口</text>
    <rect x="975" y="492" width="260" height="148" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/><text x="1105" y="540" text-anchor="middle" class="value">1 + 3 张</text><text x="1105" y="584" text-anchor="middle" class="body">主数据表与补充表</text><text x="1105" y="616" text-anchor="middle" class="body">按研究分别保存</text>
    <rect x="1270" y="492" width="245" height="148" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/><text x="1392" y="540" text-anchor="middle" class="value">115 × 31</text><text x="1392" y="584" text-anchor="middle" class="body">主数据表规模</text><text x="1392" y="616" text-anchor="middle" class="body">涉及 42 名患者</text>
  </g>
  <rect x="120" y="690" width="1360" height="88" rx="24" fill="#0F766E"/><text x="800" y="727" text-anchor="middle" class="white">当前已经形成可核对的数据包</text><text x="800" y="760" text-anchor="middle" class="white" style="font-size:21px">下一步定向补查：同一 HER2 阳性术前治疗患者组中的 PIK3CA 分子资料</text>
  <rect x="250" y="810" width="1100" height="54" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="844" text-anchor="middle" class="note">数据规模只有放回研究对象、变量、治疗和疗效中解释，才具有科研意义。</text>
</svg>
