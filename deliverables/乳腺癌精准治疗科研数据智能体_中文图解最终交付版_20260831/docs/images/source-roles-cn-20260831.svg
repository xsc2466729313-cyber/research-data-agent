<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker>
    <style>
      .title{font:700 44px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.sub{font:400 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}
      .q{font:700 27px 'Microsoft YaHei','SimHei',sans-serif;fill:#1E3A8A}.head{font:700 27px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
      .body{font:400 21px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.strong{font:700 22px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F766E}
      .bottom{font:700 24px 'Microsoft YaHei','SimHei',sans-serif;fill:#FFFFFF}.note{font:400 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="800" y="72" text-anchor="middle" class="title">多个来源为什么不能直接拼成一张患者表</text>
  <text x="800" y="112" text-anchor="middle" class="sub">不同来源各自回答问题的一部分，先按研究分别建表，才能保留真实含义</text>
  <rect x="260" y="154" width="1080" height="92" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
  <text x="800" y="192" text-anchor="middle" class="q">代表问题：HER2 阳性乳腺癌中，PIK3CA 突变与新辅助治疗响应是否相关？</text>
  <text x="800" y="224" text-anchor="middle" class="body">要回答它，三项信息必须落在同一研究、同一患者层面</text>

  <g>
    <rect x="80" y="322" width="440" height="288" rx="26" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="3"/>
    <text x="300" y="376" text-anchor="middle" class="head">GSE76360 队列</text>
    <text x="300" y="420" text-anchor="middle" class="body">HER2 阳性术前治疗研究</text>
    <line x1="130" y1="446" x2="470" y2="446" stroke="#99F6E4" stroke-width="2"/>
    <text x="300" y="488" text-anchor="middle" class="strong">可提供：患者治疗响应</text>
    <text x="300" y="530" text-anchor="middle" class="body">50 名治疗前已有记录的患者</text>
    <text x="300" y="566" text-anchor="middle" class="body">其中 48 条响应记录可用于描述</text>

    <rect x="580" y="322" width="440" height="288" rx="26" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
    <text x="800" y="376" text-anchor="middle" class="head">阿培利司治疗队列</text>
    <text x="800" y="420" text-anchor="middle" class="body">PIK3CA 靶向治疗研究</text>
    <line x1="630" y1="446" x2="970" y2="446" stroke="#FED7AA" stroke-width="2"/>
    <text x="800" y="488" text-anchor="middle" class="strong">可提供：PIK3CA 与治疗响应</text>
    <text x="800" y="530" text-anchor="middle" class="body">115 行、42 名患者</text>
    <text x="800" y="566" text-anchor="middle" class="body">适合队列内分子—响应分析</text>

    <rect x="1080" y="322" width="440" height="288" rx="26" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <text x="1300" y="376" text-anchor="middle" class="head">METABRIC 与 TCGA-BRCA</text>
    <text x="1300" y="420" text-anchor="middle" class="body">乳腺癌临床与分子资料</text>
    <line x1="1130" y1="446" x2="1470" y2="446" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1300" y="488" text-anchor="middle" class="strong">可提供：临床和分子资料</text>
    <text x="1300" y="530" text-anchor="middle" class="body">帮助理解变量分布与来源</text>
    <text x="1300" y="566" text-anchor="middle" class="body">保留为独立补充数据表</text>
  </g>

  <path d="M300 620 V676" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M800 620 V676" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1300 620 V676" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="94" y="696" width="1412" height="70" rx="24" fill="#0F766E"/>
  <text x="800" y="741" text-anchor="middle" class="bottom">分别形成 1 张主数据表和 3 张补充数据表：各自可分析，来源又能相互补充</text>
  <rect x="180" y="790" width="1240" height="68" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="800" y="832" text-anchor="middle" class="note">只有公开来源提供可靠身份对照时，来自不同研究的患者记录才进入同一行</text>
</svg>
