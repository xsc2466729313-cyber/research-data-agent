<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#2563EB"/></marker><style>
  .title{font:700 42px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.sub{font:400 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.num{font:700 30px 'Microsoft YaHei','SimHei',sans-serif;fill:#fff}.head{font:700 25px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.body{font:400 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.pass{font:700 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#047857}.review{font:700 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#C2410C}.white{font:700 25px 'Microsoft YaHei','SimHei',sans-serif;fill:#fff}.note{font:400 19px 'Microsoft YaHei','SimHei',sans-serif;fill:#334155}
  </style></defs><rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="67" text-anchor="middle" class="title">代表任务的四层质量结论：前三层通过，研究适用性需复核</text>
  <text x="800" y="108" text-anchor="middle" class="sub">局部数据质量通过，不等于最初研究问题已经回答；第四层单独检查变量是否同时满足</text>
  <g>
    <rect x="80" y="190" width="340" height="330" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/><circle cx="250" cy="245" r="34" fill="#2563EB"/><text x="250" y="255" text-anchor="middle" class="num">1</text><text x="250" y="316" text-anchor="middle" class="head">来源是否可靠</text><text x="250" y="365" text-anchor="middle" class="body">登记 50 条来源记录</text><text x="250" y="400" text-anchor="middle" class="body">数据库编号与真实地址可查</text><text x="250" y="465" text-anchor="middle" class="pass">结论：通过</text>
    <rect x="450" y="190" width="340" height="330" rx="28" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/><circle cx="620" cy="245" r="34" fill="#0F766E"/><text x="620" y="255" text-anchor="middle" class="num">2</text><text x="620" y="316" text-anchor="middle" class="head">主要字段是否齐全</text><text x="620" y="365" text-anchor="middle" class="body">按所需数据清单核对</text><text x="620" y="400" text-anchor="middle" class="body">主数据表能够形成</text><text x="620" y="465" text-anchor="middle" class="pass">结论：通过</text>
    <rect x="820" y="190" width="340" height="330" rx="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/><circle cx="990" cy="245" r="34" fill="#475569"/><text x="990" y="255" text-anchor="middle" class="num">3</text><text x="990" y="316" text-anchor="middle" class="head">患者身份是否可靠</text><text x="990" y="365" text-anchor="middle" class="body">研究—患者—样本三级编号</text><text x="990" y="400" text-anchor="middle" class="body">不同研究保持独立</text><text x="990" y="465" text-anchor="middle" class="pass">结论：通过</text>
    <rect x="1190" y="190" width="340" height="330" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/><circle cx="1360" cy="245" r="34" fill="#D97706"/><text x="1360" y="255" text-anchor="middle" class="num">4</text><text x="1360" y="316" text-anchor="middle" class="head">能否回答当前问题</text><text x="1360" y="365" text-anchor="middle" class="body">还需同一患者组同时具备</text><text x="1360" y="400" text-anchor="middle" class="body">HER2、PIK3CA 与疗效</text><text x="1360" y="465" text-anchor="middle" class="review">结论：需复核</text>
  </g>
  <path d="M800 548 V610" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
  <rect x="110" y="636" width="1380" height="100" rx="26" fill="#0F766E"/><text x="800" y="676" text-anchor="middle" class="white">系统动作：保留数据包，暂不自动发布为正式研究结论</text><text x="800" y="712" text-anchor="middle" class="white" style="font-size:21px">把缺少的 PIK3CA 同队列资料转成下一轮定向查找条件</text>
  <rect x="230" y="784" width="1140" height="66" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="825" text-anchor="middle" class="note">这样既保留前三层已经完成的工作，又保证“能形成数据表”不会被误写成“已经回答研究问题”。</text>
</svg>
