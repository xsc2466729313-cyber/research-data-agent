<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">当前系统架构与能力接入边界</title>
  <desc id="desc">以实线展示当前默认任务主链，以紫色虚线展示已实现的独立接口，以红色阻断符号展示尚未贯通或明确禁止的连接。</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dy="3" result="offset"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7C3AED"/>
    </marker>
    <style>
      .zh { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 38px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #475569; }
      .panel-title { font-size: 23px; font-weight: 800; fill: #FFFFFF; }
      .panel-kicker { font-size: 14px; font-weight: 800; fill: #E2E8F0; letter-spacing: 1px; }
      .card-title { font-size: 18px; font-weight: 800; fill: #0F172A; }
      .card-body { font-size: 14px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 12px; font-weight: 600; fill: #64748B; }
      .chip { font-size: 13px; font-weight: 800; }
      .solid-blue { fill: none; stroke: #2563EB; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .solid-teal { fill: none; stroke: #0F766E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
      .dash-purple { fill: none; stroke: #7C3AED; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .stop-red { fill: none; stroke: #DC2626; stroke-width: 3; stroke-dasharray: 7 7; stroke-linecap: round; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <circle cx="1845" cy="48" r="175" fill="#DBEAFE" opacity="0.52"/>
  <circle cx="35" cy="1030" r="185" fill="#CCFBF1" opacity="0.35"/>

  <g class="zh">
    <text x="52" y="52" class="title">当前系统架构与能力接入边界</text>
    <text x="54" y="84" class="subtitle">乳腺癌精准治疗科研数据智能体｜把“已运行的主链”与“已实现但未默认贯通的能力”分开呈现</text>

    <!-- Legend -->
    <g transform="translate(1160,34)">
      <rect x="0" y="0" width="708" height="56" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
      <path d="M24 19 H82" class="solid-blue"/><text x="94" y="24" class="chip" fill="#1D4ED8">当前默认主链</text>
      <path d="M240 19 H298" class="dash-purple"/><text x="310" y="24" class="chip" fill="#6D28D9">独立接口 / 侧链</text>
      <path d="M500 19 H552" class="stop-red"/><path d="M552 9 V29" stroke="#DC2626" stroke-width="4"/><text x="568" y="24" class="chip" fill="#B91C1C">未贯通 / 禁止</text>
      <text x="24" y="44" class="tiny">所有来源均需真实登记；虚线能力不能被写成每次网页请求都会执行。</text>
    </g>

    <!-- INPUT PANEL -->
    <rect x="44" y="116" width="356" height="654" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="44" y="116" width="356" height="62" rx="22" fill="#2563EB"/>
    <path d="M44 156 Q44 178 66 178 H378 Q400 178 400 156 V178 H44 Z" fill="#2563EB"/>
    <text x="68" y="140" class="panel-kicker">INPUT / INTERACTION</text>
    <text x="68" y="165" class="panel-title">输入与规划界面</text>

    <rect x="66" y="198" width="312" height="68" rx="14" class="card" filter="url(#shadow)"/>
    <circle cx="91" cy="232" r="16" fill="#DBEAFE"/><text x="91" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">1</text>
    <text x="117" y="225" class="card-title">宽泛研究方向</text>
    <text x="117" y="249" class="card-body">例如：哪些因素影响新辅助治疗疗效？</text>

    <path d="M222 266 V286" class="solid-blue"/>
    <rect x="66" y="292" width="312" height="168" rx="14" class="card" filter="url(#shadow)"/>
    <text x="86" y="320" class="card-title">默认科研规划工作台</text>
    <g class="tiny">
      <rect x="86" y="338" width="50" height="32" rx="10" fill="#DBEAFE"/><text x="111" y="359" text-anchor="middle">文献</text>
      <path d="M136 354 H150" class="solid-blue"/>
      <rect x="156" y="338" width="50" height="32" rx="10" fill="#DBEAFE"/><text x="181" y="359" text-anchor="middle">问题</text>
      <path d="M206 354 H220" class="solid-blue"/>
      <rect x="226" y="338" width="50" height="32" rx="10" fill="#DBEAFE"/><text x="251" y="359" text-anchor="middle">契约</text>
      <path d="M276 354 H290" class="solid-blue"/>
      <rect x="296" y="338" width="60" height="32" rx="10" fill="#DBEAFE"/><text x="326" y="359" text-anchor="middle">来源计划</text>
    </g>
    <text x="86" y="397" class="card-body">当前交互：自动选择首个推荐问题并冻结方案</text>
    <text x="86" y="421" class="card-body">显示论文依据、Source Plan 与覆盖矩阵</text>
    <text x="86" y="445" class="tiny">生成真实数据前，用户仍需点击“开始生成数据集”。</text>

    <path d="M222 460 V480" class="solid-blue"/>
    <rect x="66" y="486" width="312" height="100" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="86" y="510" class="card-title">冻结 Research Contract</text>
    <text x="86" y="534" class="card-title">Source Plan / 覆盖矩阵</text>
    <text x="86" y="557" class="card-body">已生成并可查看；Planning RAG 只辅助规划</text>
    <text x="86" y="578" class="tiny">不把论文文本直接写成患者事实。</text>

    <!-- contract block and question bridge -->
    <path d="M378 526 H421" class="stop-red"/>
    <path d="M421 510 V542" stroke="#DC2626" stroke-width="5"/>
    <text x="290" y="610" class="tiny" fill="#B91C1C">contract_id / source_plan_id</text>
    <text x="270" y="628" class="tiny" fill="#B91C1C">当前未作为下游取数硬约束</text>

    <rect x="66" y="646" width="312" height="92" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <text x="86" y="674" class="card-title">进入默认 Agent 的实际输入</text>
    <text x="86" y="699" class="card-body">选中的 research_question 文本</text>
    <text x="86" y="722" class="tiny">或高级工作台直接问题 + 数据模式 / 限量参数</text>
    <path d="M378 692 H432" class="solid-teal"/>
    <path d="M430 692 H442 V250 H448" class="solid-teal"/>

    <!-- DEFAULT AGENT PANEL -->
    <rect x="430" y="116" width="1030" height="654" rx="22" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/>
    <rect x="430" y="116" width="1030" height="62" rx="22" fill="#0F766E"/>
    <path d="M430 156 Q430 178 452 178 H1438 Q1460 178 1460 156 V178 H430 Z" fill="#0F766E"/>
    <text x="454" y="140" class="panel-kicker">SOLID LINE / CURRENT DEFAULT</text>
    <text x="454" y="165" class="panel-title">当前默认任务主链</text>
    <rect x="1186" y="131" width="248" height="32" rx="16" fill="#134E4A"/>
    <text x="1310" y="152" text-anchor="middle" class="chip" fill="#CCFBF1">真实 Adapter 产生事实，模型只负责规划</text>

    <!-- orchestration row -->
    <g filter="url(#shadow)">
      <rect x="456" y="202" width="180" height="96" rx="14" class="card" stroke="#93C5FD"/>
      <rect x="664" y="202" width="210" height="96" rx="14" class="card" stroke="#93C5FD"/>
      <rect x="902" y="202" width="234" height="96" rx="14" class="card" stroke="#5EEAD4"/>
      <rect x="1164" y="202" width="270" height="96" rx="14" class="card" stroke="#5EEAD4"/>
    </g>
    <text x="546" y="232" text-anchor="middle" class="card-title">闭环任务入口</text>
    <text x="546" y="257" text-anchor="middle" class="card-body">/api/v2/agent/closed-loop</text>
    <text x="546" y="280" text-anchor="middle" class="tiny">任务状态与审计</text>
    <text x="769" y="232" text-anchor="middle" class="card-title">ClosedLoop / Critic</text>
    <text x="769" y="257" text-anchor="middle" class="card-body">外层比较与停止</text>
    <text x="769" y="280" text-anchor="middle" class="tiny">最多 3 轮；要求至少两轮</text>
    <text x="1019" y="232" text-anchor="middle" class="card-title">ResearchAgentService</text>
    <text x="1019" y="257" text-anchor="middle" class="card-body">任务内 CollectionAgent 补搜</text>
    <text x="1019" y="280" text-anchor="middle" class="tiny">按缺口换未尝试队列 / 工具</text>
    <text x="1299" y="232" text-anchor="middle" class="card-title">ResearchSpec + ResearchBrief</text>
    <text x="1299" y="257" text-anchor="middle" class="card-body">千问提取需求并选择受控工具</text>
    <text x="1299" y="280" text-anchor="middle" class="tiny">允许时才用确定性规划兜底</text>
    <path d="M636 250 H656" class="solid-blue"/><path d="M874 250 H894" class="solid-blue"/><path d="M1136 250 H1156" class="solid-blue"/>

    <!-- source role split -->
    <path d="M1299 298 V323 H741 V337" class="solid-teal"/>
    <path d="M1299 298 V323 H1188 V337" class="solid-teal"/>
    <rect x="456" y="344" width="566" height="124" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1038" y="344" width="396" height="124" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="478" y="373" class="card-title">A｜可形成独立科研表的数据路径</text>
    <text x="478" y="400" class="card-body">GEO：Series Matrix 的 !Sample_* 元数据（不读表达数值）</text>
    <text x="478" y="425" class="card-body">cBioPortal：同一 study 内临床 / 突变 / CNA</text>
    <text x="478" y="450" class="card-body">DepMap：细胞系目录；可用响应仍固定为 preclinical_cell_line</text>
    <text x="1060" y="373" class="card-title">B｜候选、试验或证据路径</text>
    <text x="1060" y="400" class="card-body">GDC · AACT / ClinicalTrials</text>
    <text x="1060" y="425" class="card-body">CIViC · Europe PMC / Discovery</text>
    <text x="1060" y="450" class="tiny">可登记 SourceItem；不自动补患者单元格</text>

    <!-- dataset / audit row -->
    <path d="M741 468 V496" class="solid-teal"/>
    <path d="M1236 468 V483 H942 V496" class="solid-blue"/>
    <g filter="url(#shadow)">
      <rect x="456" y="504" width="220" height="126" rx="14" class="card" stroke="#5EEAD4"/>
      <rect x="694" y="504" width="234" height="126" rx="14" class="card" stroke="#5EEAD4"/>
      <rect x="946" y="504" width="226" height="126" rx="14" class="card" stroke="#FDBA74"/>
      <rect x="1190" y="504" width="244" height="126" rx="14" class="card" stroke="#FDBA74"/>
    </g>
    <text x="566" y="535" text-anchor="middle" class="card-title">ResearchDatasetBuilder</text>
    <text x="566" y="561" text-anchor="middle" class="card-body">各来源 / study 独立建表</text>
    <text x="566" y="585" text-anchor="middle" class="tiny">常用字段映射；保留来源特定原始信息</text>
    <text x="566" y="608" text-anchor="middle" class="tiny">并非全表逐字段 raw_field/raw_value</text>
    <text x="811" y="535" text-anchor="middle" class="card-title">主表选择 + 伴随表</text>
    <text x="811" y="561" text-anchor="middle" class="card-body">按本题字段 / 结局匹配选 primary</text>
    <text x="811" y="585" text-anchor="middle" class="tiny">其他 built datasets 作为 companion</text>
    <text x="811" y="608" text-anchor="middle" class="tiny">不按患者编号跨研究 Join</text>
    <text x="1059" y="535" text-anchor="middle" class="card-title">DataAlignmentAuditor</text>
    <text x="1059" y="561" text-anchor="middle" class="card-body">study / patient / sample / source</text>
    <text x="1059" y="585" text-anchor="middle" class="tiny">检查命名空间与身份完整性</text>
    <text x="1059" y="608" text-anchor="middle" class="tiny">不是默认跨库实体匹配器</text>
    <text x="1312" y="535" text-anchor="middle" class="card-title">四层 Quality Gate</text>
    <text x="1312" y="561" text-anchor="middle" class="card-body">来源｜主字段｜身份｜科研适用性</text>
    <text x="1312" y="585" text-anchor="middle" class="tiny">单次任务探索性准入</text>
    <text x="1312" y="608" text-anchor="middle" class="tiny">不等于 Gold Set SDTI / 正式发表</text>
    <path d="M676 567 H686" class="solid-teal"/><path d="M928 567 H938" class="solid-teal"/><path d="M1172 567 H1182" class="solid-teal"/>

    <!-- provenance ribbon -->
    <rect x="456" y="650" width="978" height="88" rx="14" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.8"/>
    <text x="478" y="678" class="card-title">默认主链当前能够交付的审计证据</text>
    <text x="478" y="705" class="card-body">SourceItem：source_id、accession、官方 URL、状态 / 校验值、工具日志；主表行级 source_id；GEO 另保留 raw_characteristics。</text>
    <text x="478" y="728" class="tiny">未承诺：每个宽表单元格都有独立 EvidenceCell、规则命中、置信度与原始值。</text>

    <!-- OUTPUT PANEL -->
    <rect x="1490" y="116" width="386" height="654" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <rect x="1490" y="116" width="386" height="62" rx="22" fill="#D97706"/>
    <path d="M1490 156 Q1490 178 1512 178 H1854 Q1876 178 1876 156 V178 H1490 Z" fill="#D97706"/>
    <text x="1514" y="140" class="panel-kicker">OUTPUT / REUSE</text>
    <text x="1514" y="165" class="panel-title">结果、解释与复用</text>
    <path d="M1434 567 H1482" class="solid-teal"/>

    <rect x="1514" y="202" width="338" height="98" rx="14" class="card" filter="url(#shadow)"/>
    <text x="1536" y="231" class="card-title">科研数据包</text>
    <text x="1536" y="256" class="card-body">1 张主科研表 + 不安全合并的伴随表</text>
    <text x="1536" y="280" class="tiny">字段字典、分析粒度、队列漏斗与变量覆盖</text>

    <rect x="1514" y="318" width="338" height="112" rx="14" class="card" filter="url(#shadow)"/>
    <text x="1536" y="347" class="card-title">来源与过程材料</text>
    <text x="1536" y="372" class="card-body">来源清单、官方地址、工具状态 / 日志</text>
    <text x="1536" y="396" class="card-body">行级来源与可取得的原始信息</text>
    <text x="1536" y="417" class="tiny">不能等同于全表逐单元格 Evidence。</text>

    <rect x="1514" y="448" width="338" height="116" rx="14" class="card" filter="url(#shadow)"/>
    <text x="1536" y="477" class="card-title">质量结论与缺口</text>
    <text x="1536" y="502" class="card-body">PASS / REVIEW / REJECT</text>
    <text x="1536" y="526" class="card-body">Gap、停止原因、人工复核提示</text>
    <text x="1536" y="549" class="tiny">人工决定尚未稳定自动回写旧任务主表。</text>

    <rect x="1514" y="582" width="338" height="156" rx="14" class="card" filter="url(#shadow)"/>
    <text x="1536" y="611" class="card-title">前端查看与可复用导出</text>
    <text x="1536" y="638" class="card-body">CSV · Excel · Parquet · JSON</text>
    <text x="1536" y="663" class="card-body">metadata · quality report · REST API</text>
    <rect x="1536" y="684" width="292" height="34" rx="10" fill="#FFEDD5"/>
    <text x="1682" y="706" text-anchor="middle" class="chip" fill="#9A3412">可供 Python / R 后续探索，不输出临床诊断</text>

    <!-- SIDE CHAINS -->
    <rect x="44" y="792" width="560" height="186" rx="20" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.4" stroke-dasharray="10 8"/>
    <text x="68" y="823" class="panel-kicker" style="fill:#6D28D9">DASHED / PLANNING SIDECHAIN</text>
    <text x="68" y="852" class="card-title">Planning RAG / 混合检索 / 来源关系图</text>
    <text x="68" y="880" class="card-body">检索论文片段、形成候选问题、字段需求与 accession 线索</text>
    <text x="68" y="906" class="card-body">输出服务于 Research Contract 与 Source Plan，不形成患者事实</text>
    <rect x="68" y="928" width="510" height="32" rx="10" fill="#EDE9FE"/>
    <text x="323" y="949" text-anchor="middle" class="chip" fill="#6D28D9">当前默认建表只接收选中问题文本，尚未硬绑定契约与来源计划</text>
    <path d="M324 792 V770 H222 V594" class="dash-purple"/>

    <rect x="628" y="792" width="1248" height="186" rx="20" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.4" stroke-dasharray="10 8"/>
    <text x="652" y="823" class="panel-kicker" style="fill:#6D28D9">DASHED / INDEPENDENT GOVERNANCE INTERFACES</text>
    <text x="652" y="852" class="card-title">通用解析与原子级治理：已实现并测试，但尚非默认灵活宽表的逐单元格执行链</text>
    <g class="tiny">
      <rect x="652" y="876" width="190" height="56" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
      <text x="747" y="899" text-anchor="middle" font-weight="800" fill="#0F172A">通用 Parser</text>
      <text x="747" y="919" text-anchor="middle">CSV / Excel / HTML / JATS / PDF 文本</text>
      <rect x="866" y="876" width="132" height="56" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
      <text x="932" y="899" text-anchor="middle" font-weight="800" fill="#0F172A">RawRecord</text>
      <text x="932" y="919" text-anchor="middle">原字段 / 原值</text>
      <rect x="1022" y="876" width="196" height="56" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
      <text x="1120" y="899" text-anchor="middle" font-weight="800" fill="#0F172A">SchemaMapper V2</text>
      <text x="1120" y="919" text-anchor="middle">CanonicalRecord</text>
      <rect x="1242" y="876" width="138" height="56" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
      <text x="1311" y="899" text-anchor="middle" font-weight="800" fill="#0F172A">EvidenceCell</text>
      <text x="1311" y="919" text-anchor="middle">字段级凭证</text>
      <rect x="1404" y="876" width="218" height="56" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
      <text x="1513" y="899" text-anchor="middle" font-weight="800" fill="#0F172A">PatientSampleLinker</text>
      <text x="1513" y="919" text-anchor="middle">ConflictDetector</text>
      <rect x="1646" y="876" width="206" height="56" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
      <text x="1749" y="899" text-anchor="middle" font-weight="800" fill="#0F172A">Safe Repair / Quality V2</text>
      <text x="1749" y="919" text-anchor="middle">Repair Log / Review</text>
    </g>
    <path d="M842 904 H858" class="dash-purple"/><path d="M998 904 H1014" class="dash-purple"/>
    <path d="M1218 904 H1234" class="dash-purple"/><path d="M1380 904 H1396" class="dash-purple"/>
    <path d="M1622 904 H1638" class="dash-purple"/>
    <text x="652" y="956" class="tiny">边界：当前首页无二进制文件上传；PDF 仅处理已提供文本；不具备通用 OCR / 图像曲线数字化。</text>
