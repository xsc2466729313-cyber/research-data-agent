version: "0.1"

hard_rules:
  - id: HER2_IHC_2PLUS
    description: "HER2 IHC 2+ 不得直接自动映射为 HER2 Positive"
    action: review_or_equivocal

  - id: ERBB2_CNA_NOT_IHC
    description: "ERBB2 CNA amplification 不等价于 HER2 IHC positive"
    action: preserve_separate_dimension

  - id: LOW_CONFIDENCE_PATIENT_LINK
    description: "低置信度患者/样本关联不得自动合并"
    action: unresolved

  - id: MISSING_EVIDENCE
    description: "无 Evidence 的关键字段不得正式发布"
    action: block_publish

  - id: CROSS_DOMAIN_RESPONSE
    description: "细胞系药敏与患者临床 response 必须区分 response_domain"
    action: preserve_domain

auto_fix:
  - drug_alias_exact
  - gene_alias_exact
  - casing_normalization
  - exact_duplicate

manual_or_model_review:
  - patient_identity
  - biomarker_semantic_ambiguity
  - high_authority_source_conflict
  - missing_primary_evidence
