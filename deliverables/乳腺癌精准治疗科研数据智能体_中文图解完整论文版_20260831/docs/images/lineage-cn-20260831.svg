<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#2563EB"/></marker><style>
  .title{font:700 42px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.sub{font:400 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.head{font:700 25px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.body{font:400 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.small{font:400 18px 'Microsoft YaHei','SimHei',sans-serif;fill:#64748B}.value{font:700 29px 'Microsoft YaHei','SimHei',sans-serif;fill:#1D4ED8}.white{font:700 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#fff}.note{font:400 19px 'Microsoft YaHei','SimHei',sans-serif;fill:#334155}
  </style></defs><rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="66" text-anchor="middle" class="title">数据来路怎样查看：从科研问题一直追到最终数据表</text>
  <text x="800" y="107" text-anchor="middle" class="sub">50 条来源记录归入 25 个去重后的来源入口；连线表示发现与引用关系，不表示患者已经合并</text>
  <g>
    <rect x="90" y="174" width="300" height="176" rx="26" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/><text x="240" y="224" text-anchor="middle" class="head">科研问题</text><text x="240" y="272" text-anchor="middle" class="body">HER2、PIK3CA</text><text x="240" y="308" text-anchor="middle" class="body">术前治疗与患者疗效</text>
    <path d="M400 262 H510" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
    <rect x="530" y="174" width="300" height="176" rx="26" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/><text x="680" y="224" text-anchor="middle" class="head">来源入口</text><text x="680" y="272" text-anchor="middle" class="value">25 个</text><text x="680" y="308" text-anchor="middle" class="body">论文与公开数据库入口</text>
    <path d="M840 262 H950" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
    <rect x="970" y="174" width="300" height="176" rx="26" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/><text x="1120" y="224" text-anchor="middle" class="head">来源记录</text><text x="1120" y="272" text-anchor="middle" class="value">50 条</text><text x="1120" y="308" text-anchor="middle" class="body">编号、地址、用途和所属研究</text>
    <path d="M1280 262 H1390" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
    <rect x="1410" y="174" width="140" height="176" rx="26" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="3"/><text x="1480" y="224" text-anchor="middle" class="head">数据表</text><text x="1480" y="272" text-anchor="middle" class="value">1 + 3</text><text x="1480" y="308" text-anchor="middle" class="body">主表与</text><text x="1480" y="335" text-anchor="middle" class="body">补充表</text>
  </g>
  <text x="95" y="430" class="head">一条代表路径如何解释</text>
  <rect x="90" y="462" width="1420" height="246" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g>
    <circle cx="220" cy="585" r="66" fill="#1E40AF"/><text x="220" y="578" text-anchor="middle" class="white">科研</text><text x="220" y="610" text-anchor="middle" class="white">问题</text>
    <path d="M292 585 H430" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
    <rect x="455" y="520" width="270" height="130" rx="24" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="3"/><text x="590" y="570" text-anchor="middle" class="head">公开数据库入口</text><text x="590" y="613" text-anchor="middle" class="body">如 GEO、cBioPortal</text>
    <path d="M735 585 H850" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
    <rect x="875" y="520" width="270" height="130" rx="24" fill="#FFFFFF" stroke="#FDBA74" stroke-width="3"/><text x="1010" y="570" text-anchor="middle" class="head">所属研究记录</text><text x="1010" y="613" text-anchor="middle" class="body">保留编号、地址和用途</text>
    <path d="M1155 585 H1270" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
    <rect x="1295" y="520" width="170" height="130" rx="24" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="3"/><text x="1380" y="570" text-anchor="middle" class="head">对应数据表</text><text x="1380" y="613" text-anchor="middle" class="body">保持研究独立</text>
  </g>
  <rect x="180" y="758" width="1240" height="92" rx="24" fill="#0F766E"/><text x="800" y="797" text-anchor="middle" class="white">能查看的是“问题怎样找到入口、入口怎样形成数据表”</text><text x="800" y="831" text-anchor="middle" class="white" style="font-size:20px">不能从连线推断不同研究中的患者是同一个人；患者连接仍需独立身份依据。</text>
</svg>
