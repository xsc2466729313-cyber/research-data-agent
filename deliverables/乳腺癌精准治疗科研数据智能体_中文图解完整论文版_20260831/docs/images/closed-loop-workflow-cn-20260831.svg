<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker>
    <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D97706"/></marker>
    <style>
      .title{font:700 44px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.sub{font:400 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}
      .num{font:700 22px 'Microsoft YaHei','SimHei',sans-serif;fill:#FFFFFF}.step{font:700 28px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
      .body{font:400 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.label{font:700 21px 'Microsoft YaHei','SimHei',sans-serif;fill:#9A3412}
      .action{font:700 22px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="800" y="74" text-anchor="middle" class="title">一次任务如何形成“查找—核对—再查找”的闭环</text>
  <text x="800" y="116" text-anchor="middle" class="sub">每一步都使用上一步留下的条件，质量判断再决定下一步动作</text>

  <g>
    <rect x="100" y="184" width="360" height="190" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
    <circle cx="150" cy="232" r="27" fill="#2563EB"/><text x="150" y="240" text-anchor="middle" class="num">1</text>
    <text x="310" y="242" text-anchor="middle" class="step">提出研究问题</text>
    <text x="280" y="300" text-anchor="middle" class="body">明确研究对象与目标</text>
    <text x="280" y="334" text-anchor="middle" class="body">不先假定答案</text>

    <rect x="620" y="184" width="360" height="190" rx="24" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="3"/>
    <circle cx="670" cy="232" r="27" fill="#0F766E"/><text x="670" y="240" text-anchor="middle" class="num">2</text>
    <text x="830" y="242" text-anchor="middle" class="step">列出必要数据</text>
    <text x="800" y="300" text-anchor="middle" class="body">人群、分子变量、治疗、结果</text>
    <text x="800" y="334" text-anchor="middle" class="body">共同构成核对清单</text>

    <rect x="1140" y="184" width="360" height="190" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
    <circle cx="1190" cy="232" r="27" fill="#D97706"/><text x="1190" y="240" text-anchor="middle" class="num">3</text>
    <text x="1350" y="242" text-anchor="middle" class="step">查找并取得记录</text>
    <text x="1320" y="300" text-anchor="middle" class="body">先定位论文和数据编号</text>
    <text x="1320" y="334" text-anchor="middle" class="body">再从真实入口取得原始记录</text>

    <rect x="1140" y="466" width="360" height="190" rx="24" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="1190" cy="514" r="27" fill="#475569"/><text x="1190" y="522" text-anchor="middle" class="num">4</text>
    <text x="1350" y="524" text-anchor="middle" class="step">按研究分别建表</text>
    <text x="1320" y="582" text-anchor="middle" class="body">统一字段，登记每行来源</text>
    <text x="1320" y="616" text-anchor="middle" class="body">不同研究先保持独立</text>

    <rect x="620" y="466" width="360" height="190" rx="24" fill="#FEFCE8" stroke="#FACC15" stroke-width="3"/>
    <circle cx="670" cy="514" r="27" fill="#CA8A04"/><text x="670" y="522" text-anchor="middle" class="num">5</text>
    <text x="830" y="524" text-anchor="middle" class="step">逐项判断能否分析</text>
    <text x="800" y="582" text-anchor="middle" class="body">查来源、查字段、查身份</text>
    <text x="800" y="616" text-anchor="middle" class="body">再查是否覆盖当前问题</text>

    <rect x="100" y="466" width="360" height="190" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/>
    <circle cx="150" cy="514" r="27" fill="#059669"/><text x="150" y="522" text-anchor="middle" class="num">6</text>
    <text x="310" y="524" text-anchor="middle" class="step">输出科研数据包</text>
    <text x="280" y="582" text-anchor="middle" class="body">数据表、字段说明、来源清单</text>
    <text x="280" y="616" text-anchor="middle" class="body">以及质量与适用性说明</text>
  </g>

  <path d="M470 279 H608" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M990 279 H1128" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1320 386 V454" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1130 561 H992" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 561 H472" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <rect x="126" y="732" width="1348" height="112" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="800" y="772" text-anchor="middle" class="label">质量判断不是终点，而是下一轮工作的起点</text>
  <rect x="196" y="794" width="330" height="36" rx="18" fill="#FFEDD5"/><text x="361" y="820" text-anchor="middle" class="action">资料不足 → 回到第 3 步补查</text>
  <rect x="635" y="794" width="330" height="36" rx="18" fill="#FEF3C7"/><text x="800" y="820" text-anchor="middle" class="action">字段问题 → 回到第 4 步修正</text>
  <rect x="1074" y="794" width="330" height="36" rx="18" fill="#D1FAE5"/><text x="1239" y="820" text-anchor="middle" class="action">条件满足 → 进入第 6 步输出</text>
  <path d="M800 660 V710 H1540 V404 H1320 V386" stroke="#D97706" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#orange)"/>
</svg>
