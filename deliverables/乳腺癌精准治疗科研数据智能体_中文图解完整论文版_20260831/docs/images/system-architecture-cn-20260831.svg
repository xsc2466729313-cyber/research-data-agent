<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D97706"/>
    </marker>
    <style>
      .title{font:700 44px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
      .sub{font:400 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}
      .step{font:700 26px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
      .body{font:400 19px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}
      .badge{font:700 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#FFFFFF}
      .strip{font:700 22px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
      .small{font:400 17px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}
      .out{font:700 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F766E}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="800" y="72" text-anchor="middle" class="title">系统如何把一个科研问题变成数据包</text>
  <text x="800" y="112" text-anchor="middle" class="sub">问题决定要找什么，真实来源提供记录，逐项核对决定结果能否进入分析</text>

  <g>
    <rect x="54" y="182" width="260" height="320" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
    <circle cx="98" cy="226" r="25" fill="#2563EB"/>
    <text x="98" y="234" text-anchor="middle" class="badge">1</text>
    <text x="209" y="236" text-anchor="middle" class="step">明确研究条件</text>
    <text x="184" y="300" text-anchor="middle" class="body">研究谁</text>
    <text x="184" y="338" text-anchor="middle" class="body">观察什么分子变量</text>
    <text x="184" y="376" text-anchor="middle" class="body">接受何种治疗</text>
    <text x="184" y="414" text-anchor="middle" class="body">用什么结果判断</text>
    <rect x="88" y="448" width="192" height="34" rx="17" fill="#DBEAFE"/>
    <text x="184" y="472" text-anchor="middle" class="small">形成“所需数据清单”</text>

    <rect x="362" y="182" width="260" height="320" rx="24" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="3"/>
    <circle cx="406" cy="226" r="25" fill="#0F766E"/>
    <text x="406" y="234" text-anchor="middle" class="badge">2</text>
    <text x="517" y="236" text-anchor="middle" class="step">查找真实来源</text>
    <text x="492" y="306" text-anchor="middle" class="body">先找论文和数据编号</text>
    <text x="492" y="346" text-anchor="middle" class="body">再进入公开数据库取数</text>
    <text x="492" y="386" text-anchor="middle" class="body">记录入口、编号和用途</text>
    <rect x="396" y="448" width="192" height="34" rx="17" fill="#CCFBF1"/>
    <text x="492" y="472" text-anchor="middle" class="small">只登记可核对来源</text>

    <rect x="670" y="182" width="260" height="320" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
    <circle cx="714" cy="226" r="25" fill="#D97706"/>
    <text x="714" y="234" text-anchor="middle" class="badge">3</text>
    <text x="825" y="236" text-anchor="middle" class="step">取得原始记录</text>
    <text x="800" y="306" text-anchor="middle" class="body">调用固定取数接口</text>
    <text x="800" y="346" text-anchor="middle" class="body">读取真实患者和样本记录</text>
    <text x="800" y="386" text-anchor="middle" class="body">不补写缺失的患者事实</text>
    <rect x="704" y="448" width="192" height="34" rx="17" fill="#FFEDD5"/>
    <text x="800" y="472" text-anchor="middle" class="small">原始值同步保留</text>

    <rect x="978" y="182" width="260" height="320" rx="24" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="1022" cy="226" r="25" fill="#475569"/>
    <text x="1022" y="234" text-anchor="middle" class="badge">4</text>
    <text x="1133" y="236" text-anchor="middle" class="step">整理并逐项核对</text>
    <text x="1108" y="306" text-anchor="middle" class="body">统一字段名称与含义</text>
    <text x="1108" y="346" text-anchor="middle" class="body">按研究分别建立数据表</text>
    <text x="1108" y="386" text-anchor="middle" class="body">核对患者身份和医学含义</text>
    <rect x="1012" y="448" width="192" height="34" rx="17" fill="#E2E8F0"/>
    <text x="1108" y="472" text-anchor="middle" class="small">登记来源；可取得原值则并列</text>

    <rect x="1286" y="182" width="260" height="320" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/>
    <circle cx="1330" cy="226" r="25" fill="#059669"/>
    <text x="1330" y="234" text-anchor="middle" class="badge">5</text>
    <text x="1441" y="236" text-anchor="middle" class="step">判断并输出</text>
    <text x="1416" y="296" text-anchor="middle" class="out">数据表</text>
    <text x="1416" y="334" text-anchor="middle" class="out">字段说明</text>
    <text x="1416" y="372" text-anchor="middle" class="out">来源清单</text>
    <text x="1416" y="410" text-anchor="middle" class="out">质量说明</text>
    <rect x="1320" y="448" width="192" height="34" rx="17" fill="#D1FAE5"/>
    <text x="1416" y="472" text-anchor="middle" class="small">给出下一步科研动作</text>
  </g>

  <path d="M318 342 H350" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M626 342 H658" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M934 342 H966" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1242 342 H1274" stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <rect x="74" y="570" width="1452" height="150" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="112" y="616" class="strip">真实资料来源</text>
  <rect x="112" y="644" width="280" height="50" rx="14" fill="#DBEAFE"/>
  <text x="252" y="677" text-anchor="middle" class="body">GEO：基因表达与样本资料</text>
  <rect x="416" y="644" width="332" height="50" rx="14" fill="#CCFBF1"/>
  <text x="582" y="677" text-anchor="middle" class="body">cBioPortal：临床与分子资料</text>
  <rect x="772" y="644" width="300" height="50" rx="14" fill="#FFEDD5"/>
  <text x="922" y="677" text-anchor="middle" class="body">GDC/TCGA：癌症组学资料</text>
  <rect x="1096" y="644" width="392" height="50" rx="14" fill="#E2E8F0"/>
  <text x="1292" y="677" text-anchor="middle" class="body">Europe PMC：论文与补充材料线索</text>

  <path d="M1416 518 V790 H492 V520" stroke="#D97706" stroke-width="5" stroke-dasharray="12 8" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="590" y="757" width="728" height="58" rx="29" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="954" y="794" text-anchor="middle" class="step" fill="#9A3412">缺哪一项，就把哪一项变成下一轮查找条件</text>
  <text x="800" y="864" text-anchor="middle" class="sub">主线始终围绕同一个研究问题推进，避免“找到很多资料，却无法用于分析”</text>
</svg>
