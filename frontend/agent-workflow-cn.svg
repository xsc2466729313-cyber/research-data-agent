<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc">
  <title id="title">中文智能体协作工作流</title>
  <desc id="desc">研究问题经过任务统筹、研究规划、多源查找、数据整理、独立检查和质量把关，形成可追溯科研结果；发现缺口后回到补充查找。</desc>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8b96b3"/></marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b89052"/></marker>
  </defs>
  <rect width="1320" height="700" rx="18" fill="#fbfcff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="42" y="42" fill="#27345f" font-size="22" font-weight="700">智能体协作工作流</text>
    <text x="42" y="70" fill="#7c8499" font-size="14">复杂研究任务由多个有边界的角色接力完成，简单任务仍使用单一确定性处理</text>
    <g stroke="#8b96b3" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M178 170 H205"/><path d="M355 170 H382"/><path d="M532 170 H568"/><path d="M718 170 H754"/><path d="M904 170 H940"/><path d="M1090 170 H1126"/><path d="M645 232 V292"/><path d="M645 390 V438"/><path d="M1201 214 V288"/><path d="M1126 332 H1080 V214"/></g>
    <g text-anchor="middle">
      <g><rect x="38" y="126" width="140" height="88" rx="12" fill="#eef2ff" stroke="#bac6ee"/><text x="108" y="163" fill="#3d4f9a" font-size="18" font-weight="700">研究问题</text><text x="108" y="190" fill="#697493" font-size="13">用户想研究什么</text></g>
      <g><rect x="205" y="126" width="150" height="88" rx="12" fill="#eef8f5" stroke="#b4ded1"/><text x="280" y="163" fill="#247d67" font-size="18" font-weight="700">任务统筹</text><text x="280" y="190" fill="#697493" font-size="13">安排整个任务</text></g>
      <g><rect x="382" y="126" width="150" height="88" rx="12" fill="#fff7e9" stroke="#ecd39e"/><text x="457" y="163" fill="#9b7026" font-size="18" font-weight="700">研究规划</text><text x="457" y="190" fill="#697493" font-size="13">明确对象、变量和目标</text></g>
      <g><rect x="568" y="126" width="150" height="88" rx="12" fill="#f2efff" stroke="#cfc1f2"/><text x="643" y="163" fill="#7051a5" font-size="18" font-weight="700">多源查找</text><text x="643" y="190" fill="#697493" font-size="13">寻找真实公开资料</text></g>
      <g><rect x="754" y="126" width="150" height="88" rx="12" fill="#edf6fb" stroke="#b9d8e9"/><text x="829" y="163" fill="#36748e" font-size="18" font-weight="700">数据整理</text><text x="829" y="190" fill="#697493" font-size="13">统一字段和研究边界</text></g>
      <g><rect x="940" y="126" width="150" height="88" rx="12" fill="#fff1f0" stroke="#edc0bc"/><text x="1015" y="163" fill="#a14f4a" font-size="18" font-weight="700">独立检查</text><text x="1015" y="190" fill="#697493" font-size="13">找出缺口和冲突</text></g>
      <g><rect x="1126" y="126" width="150" height="88" rx="12" fill="#eef8f5" stroke="#b4ded1"/><text x="1201" y="163" fill="#247d67" font-size="18" font-weight="700">质量把关</text><text x="1201" y="190" fill="#697493" font-size="13">决定能否交付</text></g>
      <g><rect x="565" y="292" width="160" height="98" rx="12" fill="#fffaf0" stroke="#e8c982"/><text x="645" y="328" fill="#9b7026" font-size="18" font-weight="700">并行查找</text><text x="645" y="355" fill="#697493" font-size="13">患者资料</text><text x="645" y="376" fill="#697493" font-size="13">论文证据 · 试验信息</text></g>
      <g><rect x="565" y="438" width="160" height="82" rx="12" fill="#fff7e9" stroke="#e8c982"/><text x="645" y="472" fill="#9b7026" font-size="18" font-weight="700">缺口补查</text><text x="645" y="498" fill="#697493" font-size="13">缺什么，再找什么</text></g>
      <g><rect x="1126" y="288" width="150" height="88" rx="12" fill="#eef2ff" stroke="#bac6ee"/><text x="1201" y="325" fill="#3d4f9a" font-size="18" font-weight="700">结果交付</text><text x="1201" y="352" fill="#697493" font-size="13">数据、来源和说明</text></g>
    </g>
    <g fill="none" stroke="#b89052" stroke-width="2" marker-end="url(#b)"><path d="M1201 376 V580 H645 V520"/></g>
    <text x="770" y="572" fill="#7d6a45" font-size="13">发现字段、证据或身份缺口时，回到这里补充查找</text>
    <text x="735" y="275" fill="#7d6a45" font-size="13">彼此独立的资料可以同时查找</text>
    <text x="1080" y="270" fill="#6f7890" font-size="13">通过</text>
  </g>
</svg>
