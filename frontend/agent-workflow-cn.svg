<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">混合式多 Agent 科研数据工作流</title>
  <desc id="desc">研究问题进入主 Agent，由规划 Agent 制定方案，检索 Agent 并行查找资料，经规则模块整理、Critic Agent 质疑和 Quality Agent 把关，最终输出科研数据交付包。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52677b"/></marker>
    <marker id="loop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b56e1f"/></marker>
  </defs>
  <rect width="1600" height="1220" fill="#f7f9fb"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="58" y="54" fill="#17324d" font-size="31" font-weight="700">混合式多 Agent 科研数据工作流</text>
    <text x="58" y="82" fill="#617285" font-size="15">主流程从左到右；回路表示补查或重新检索</text>
    <g transform="translate(1030 35)" font-size="14" fill="#53677a">
      <rect x="0" y="0" width="30" height="20" rx="8" fill="#e4f2ee" stroke="#16806e"/><text x="40" y="15">Agent</text>
      <rect x="105" y="0" width="30" height="20" fill="#eaf1f4" stroke="#4c7c8c"/><text x="145" y="15">规则模块</text>
      <polygon points="245,10 261,0 277,10 261,20" fill="#fff1d9" stroke="#bd7922"/><text x="287" y="15">判断</text>
      <path d="M345 0 H373 L380 7 V20 H345 Z" fill="#edf0ff" stroke="#657bb7"/><text x="390" y="15">输入/输出</text>
    </g>

    <!-- 顶部编排主线 -->
    <path d="M60 150 H275 L290 165 V270 H60 Z" fill="#edf0ff" stroke="#657bb7" stroke-width="2"/><path d="M275 150 V165 H290" fill="none" stroke="#657bb7" stroke-width="2"/>
    <text x="175" y="190" text-anchor="middle" fill="#314c89" font-size="20" font-weight="700">输入：研究问题</text><text x="175" y="220" text-anchor="middle" fill="#637391" font-size="14">人群、因素、结局</text><text x="175" y="245" text-anchor="middle" fill="#637391" font-size="14">数据与证据要求</text>
    <path d="M290 210 H340" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="340" y="135" width="300" height="130" rx="18" fill="#e4f2ee" stroke="#16806e" stroke-width="2.4"/><text x="490" y="174" text-anchor="middle" fill="#0e6253" font-size="22" font-weight="700">主 Agent｜任务总控</text><text x="490" y="204" text-anchor="middle" fill="#4e716a" font-size="13">输入：研究问题</text><text x="490" y="228" text-anchor="middle" fill="#4e716a" font-size="13">功能：拆分、调度、隔离上下文</text><text x="490" y="251" text-anchor="middle" fill="#4e716a" font-size="13">输出：任务顺序</text>
    <path d="M640 200 H700" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="135" width="240" height="130" rx="18" fill="#e4f2ee" stroke="#16806e" stroke-width="2.2"/><text x="820" y="174" text-anchor="middle" fill="#0e6253" font-size="21" font-weight="700">规划 Agent</text><text x="820" y="204" text-anchor="middle" fill="#4e716a" font-size="13">输入：任务顺序</text><text x="820" y="228" text-anchor="middle" fill="#4e716a" font-size="13">功能：明确研究方案</text><text x="820" y="251" text-anchor="middle" fill="#4e716a" font-size="13">输出：字段与来源计划</text>
    <path d="M940 200 H1010" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1010" y="135" width="300" height="130" rx="18" fill="#e4f2ee" stroke="#16806e" stroke-width="2.4"/><text x="1160" y="174" text-anchor="middle" fill="#0e6253" font-size="22" font-weight="700">检索 Agent</text><text x="1160" y="204" text-anchor="middle" fill="#4e716a" font-size="13">输入：方案与字段清单</text><text x="1160" y="228" text-anchor="middle" fill="#4e716a" font-size="13">功能：并行查找资料</text><text x="1160" y="251" text-anchor="middle" fill="#4e716a" font-size="13">输出：来源与候选资料</text>

    <!-- 并行资料与汇合判断 -->
    <path d="M1160 265 V315 H330 V355 M1160 265 V355 M1160 315 H1270 V355" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="180" y="355" width="300" height="90" rx="10" fill="#f2edfb" stroke="#8768bd" stroke-width="1.8"/><text x="330" y="392" text-anchor="middle" fill="#5a3d8d" font-size="18" font-weight="700">患者资料</text><text x="330" y="419" text-anchor="middle" fill="#736c86" font-size="13">临床、治疗、结局</text>
    <rect x="620" y="355" width="300" height="90" rx="10" fill="#f2edfb" stroke="#8768bd" stroke-width="1.8"/><text x="770" y="392" text-anchor="middle" fill="#5a3d8d" font-size="18" font-weight="700">论文证据</text><text x="770" y="419" text-anchor="middle" fill="#736c86" font-size="13">研究编号、变量定义</text>
    <rect x="1060" y="355" width="300" height="90" rx="10" fill="#f2edfb" stroke="#8768bd" stroke-width="1.8"/><text x="1210" y="392" text-anchor="middle" fill="#5a3d8d" font-size="18" font-weight="700">试验信息</text><text x="1210" y="419" text-anchor="middle" fill="#736c86" font-size="13">方案、入组条件</text>
    <path d="M330 445 V475 H770 V475 M770 445 V475 M1210 445 V475 H770" fill="none" stroke="#52677b" stroke-width="2"/>
    <path d="M770 475 V490" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="770,490 910,555 770,620 630,555" fill="#fff1d9" stroke="#bd7922" stroke-width="2.3"/><text x="770" y="550" text-anchor="middle" fill="#805517" font-size="20" font-weight="700">资料足够？</text><text x="770" y="577" text-anchor="middle" fill="#946b31" font-size="14">关键字段、证据、身份</text>

    <!-- 缺口补查回路 -->
    <path d="M630 555 H490" fill="none" stroke="#b56e1f" stroke-width="2" marker-end="url(#loop)"/><text x="560" y="542" text-anchor="middle" fill="#a46820" font-size="13">否</text>
    <rect x="150" y="505" width="340" height="100" fill="#eaf1f4" stroke="#4c7c8c" stroke-width="2"/><text x="320" y="540" text-anchor="middle" fill="#2c6271" font-size="18" font-weight="700">缺口补查</text><text x="320" y="567" text-anchor="middle" fill="#5b7680" font-size="13">输入：缺少的字段或证据</text><text x="320" y="590" text-anchor="middle" fill="#5b7680" font-size="13">输出：新的检索任务</text>
    <path d="M150 555 H35 V285 H1080 V265" fill="none" stroke="#b56e1f" stroke-width="2" marker-end="url(#loop)"/>

    <!-- 标准化、质疑、质量门 -->
    <path d="M770 620 V660" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="648" fill="#267664" font-size="13">是</text>
    <rect x="620" y="660" width="300" height="100" fill="#eaf1f4" stroke="#4c7c8c" stroke-width="2"/><text x="770" y="695" text-anchor="middle" fill="#2c6271" font-size="18" font-weight="700">规则模块：数据整理</text><text x="770" y="722" text-anchor="middle" fill="#5b7680" font-size="13">输入：来源与原始记录</text><text x="770" y="745" text-anchor="middle" fill="#5b7680" font-size="13">输出：标准字段与来源对应</text>
    <path d="M920 710 H980" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="980" y="660" width="300" height="100" rx="18" fill="#e4f2ee" stroke="#16806e" stroke-width="2.2"/><text x="1130" y="695" text-anchor="middle" fill="#0e6253" font-size="20" font-weight="700">Critic Agent</text><text x="1130" y="722" text-anchor="middle" fill="#4e716a" font-size="13">输入：标准数据与证据</text><text x="1130" y="745" text-anchor="middle" fill="#4e716a" font-size="13">输出：缺口、冲突清单</text>
    <path d="M1280 710 H1340" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/><text x="1308" y="697" fill="#267664" font-size="13">检查</text>
    <polygon points="1340,650 1470,710 1340,770 1210,710" fill="#fff1d9" stroke="#bd7922" stroke-width="2.3"/><text x="1340" y="705" text-anchor="middle" fill="#805517" font-size="19" font-weight="700">发现问题？</text><text x="1340" y="730" text-anchor="middle" fill="#946b31" font-size="13">缺口、冲突</text>
    <path d="M1470 710 H1545 V310 H1240 V265" fill="none" stroke="#b56e1f" stroke-width="2" marker-end="url(#loop)"/><text x="1480" y="696" fill="#a46820" font-size="13">是：交回检索</text>
    <path d="M1340 770 V820" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/><text x="1360" y="804" fill="#267664" font-size="13">否</text>
    <rect x="1190" y="820" width="300" height="100" rx="18" fill="#e4f2ee" stroke="#16806e" stroke-width="2.2"/><text x="1340" y="855" text-anchor="middle" fill="#0e6253" font-size="20" font-weight="700">Quality Agent</text><text x="1340" y="882" text-anchor="middle" fill="#4e716a" font-size="13">输入：问题清单与质量指标</text><text x="1340" y="905" text-anchor="middle" fill="#4e716a" font-size="13">输出：质量检查结果</text>
    <path d="M1190 870 H1040" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="900,815 1040,875 900,935 760,875" fill="#fff1d9" stroke="#bd7922" stroke-width="2.3"/><text x="900" y="868" text-anchor="middle" fill="#805517" font-size="18" font-weight="700">质量和医学安全</text><text x="900" y="893" text-anchor="middle" fill="#805517" font-size="18" font-weight="700">通过？</text>
    <path d="M760 875 H620" fill="none" stroke="#b56e1f" stroke-width="2" marker-end="url(#loop)"/><text x="690" y="862" text-anchor="middle" fill="#a46820" font-size="13">否</text>
    <path d="M900 935 V1000 H1180" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="974" fill="#267664" font-size="13">是</text>
    <path d="M340 820 H605 L620 835 V930 H340 Z" fill="#fff8ed" stroke="#bd7922" stroke-width="1.8"/><path d="M605 820 V835 H620" fill="none" stroke="#bd7922" stroke-width="1.8"/><text x="480" y="855" text-anchor="middle" fill="#805517" font-size="18" font-weight="700">人工复核</text><text x="480" y="882" text-anchor="middle" fill="#946b31" font-size="13">输入：未通过结果</text><text x="480" y="905" text-anchor="middle" fill="#946b31" font-size="13">输出：确认意见</text>
    <path d="M1180 970 H1440 L1455 985 V1085 H1180 Z" fill="#edf0ff" stroke="#657bb7" stroke-width="2"/><path d="M1440 970 V985 H1455" fill="none" stroke="#657bb7" stroke-width="2"/><text x="1318" y="1005" text-anchor="middle" fill="#314c89" font-size="17" font-weight="700">输出：科研数据交付包</text><text x="1318" y="1032" text-anchor="middle" fill="#637391" font-size="13">数据表、来源、字段说明、质量报告</text>
    <path d="M1180 970 V1000" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
