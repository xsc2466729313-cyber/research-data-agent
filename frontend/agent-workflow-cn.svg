<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1650" role="img" aria-labelledby="title desc">
  <title id="title">混合式多 Agent 科研数据工作流</title>
  <desc id="desc">研究问题经过主 Agent、规划 Agent、检索 Agent、规则模块、Critic Agent 和 Quality Agent，最终形成科研数据交付包。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#66758b"/></marker>
    <marker id="loop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b27627"/></marker>
  </defs>
  <rect width="1600" height="1650" fill="#fbfcfd"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="70" y="58" fill="#243653" font-size="32" font-weight="700">混合式多 Agent 科研数据工作流</text>
    <g transform="translate(1030 38)" font-size="14" fill="#586980">
      <rect x="0" y="0" width="30" height="20" rx="8" fill="#e7f4f0" stroke="#3b9b83"/><text x="40" y="15">Agent</text>
      <rect x="105" y="0" width="30" height="20" fill="#edf4f7" stroke="#6798a8"/><text x="145" y="15">规则模块</text>
      <polygon points="245,10 261,0 277,10 261,20" fill="#fff2dc" stroke="#c58528"/><text x="287" y="15">判断</text>
      <path d="M345 0 H373 L380 7 V20 H345 Z" fill="#eef1ff" stroke="#7285bb"/><text x="390" y="15">输入/输出</text>
    </g>
    <path d="M80 145 H355 L370 160 V275 H80 Z" fill="#eef1ff" stroke="#7285bb" stroke-width="2"/><path d="M355 145 V160 H370" fill="none" stroke="#7285bb" stroke-width="2"/>
    <text x="225" y="188" text-anchor="middle" fill="#3f548f" font-size="21" font-weight="700">输入：研究问题</text><text x="225" y="220" text-anchor="middle" fill="#687996" font-size="14">人群、因素、结局</text><text x="225" y="245" text-anchor="middle" fill="#687996" font-size="14">数据与证据要求</text>
    <path d="M370 210 H500" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="500" y="125" width="520" height="150" rx="22" fill="#e7f4f0" stroke="#3b9b83" stroke-width="2.5"/>
    <text x="760" y="169" text-anchor="middle" fill="#176a58" font-size="24" font-weight="700">主 Agent｜任务总控</text><text x="760" y="201" text-anchor="middle" fill="#4e716a" font-size="14">输入：研究问题</text><text x="760" y="228" text-anchor="middle" fill="#4e716a" font-size="14">功能：拆分任务、调度角色、管理上下文</text><text x="760" y="255" text-anchor="middle" fill="#4e716a" font-size="14">输出：任务顺序</text>
    <path d="M760 275 V330" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="330" width="400" height="112" rx="20" fill="#e7f4f0" stroke="#3b9b83" stroke-width="2"/>
    <text x="760" y="367" text-anchor="middle" fill="#176a58" font-size="22" font-weight="700">规划 Agent</text><text x="760" y="396" text-anchor="middle" fill="#4e716a" font-size="14">输入：任务顺序</text><text x="760" y="421" text-anchor="middle" fill="#4e716a" font-size="14">输出：方案、字段、来源计划</text>
    <path d="M760 442 V485" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="485" width="400" height="112" rx="20" fill="#e7f4f0" stroke="#3b9b83" stroke-width="2"/>
    <text x="760" y="522" text-anchor="middle" fill="#176a58" font-size="22" font-weight="700">检索 Agent</text><text x="760" y="551" text-anchor="middle" fill="#4e716a" font-size="14">输入：方案与字段清单</text><text x="760" y="576" text-anchor="middle" fill="#4e716a" font-size="14">输出：真实来源与候选资料</text>
    <path d="M760 597 V640 H230 V680" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 597 V680" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 597 V640 H1290 V680" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="80" y="680" width="300" height="95" rx="12" fill="#f4f0fb" stroke="#ad95d4" stroke-width="1.8"/><text x="230" y="718" text-anchor="middle" fill="#654c92" font-size="18" font-weight="700">患者资料</text><text x="230" y="746" text-anchor="middle" fill="#706b83" font-size="14">临床、治疗、结局</text>
    <rect x="610" y="680" width="300" height="95" rx="12" fill="#f4f0fb" stroke="#ad95d4" stroke-width="1.8"/><text x="760" y="718" text-anchor="middle" fill="#654c92" font-size="18" font-weight="700">论文证据</text><text x="760" y="746" text-anchor="middle" fill="#706b83" font-size="14">研究编号、变量定义</text>
    <rect x="1140" y="680" width="300" height="95" rx="12" fill="#f4f0fb" stroke="#ad95d4" stroke-width="1.8"/><text x="1290" y="718" text-anchor="middle" fill="#654c92" font-size="18" font-weight="700">试验信息</text><text x="1290" y="746" text-anchor="middle" fill="#706b83" font-size="14">方案、入组条件</text>
    <path d="M230 775 V805 H760 V820" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 775 V820" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1290 775 V805 H760 V820" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="760,820 900,895 760,970 620,895" fill="#fff2dc" stroke="#c58528" stroke-width="2.3"/><text x="760" y="888" text-anchor="middle" fill="#8b5f20" font-size="20" font-weight="700">资料足够？</text><text x="760" y="916" text-anchor="middle" fill="#8b5f20" font-size="14">关键字段、证据、身份</text>
    <path d="M620 895 H430" fill="none" stroke="#b27627" stroke-width="2" marker-end="url(#loop)"/><text x="525" y="882" text-anchor="middle" fill="#a16b25" font-size="14">否</text>
    <rect x="80" y="840" width="350" height="112" fill="#edf4f7" stroke="#6798a8" stroke-width="2"/><text x="255" y="878" text-anchor="middle" fill="#326d79" font-size="19" font-weight="700">缺口补查</text><text x="255" y="907" text-anchor="middle" fill="#5d7680" font-size="14">输入：缺少的字段或证据</text><text x="255" y="932" text-anchor="middle" fill="#5d7680" font-size="14">输出：新的检索任务</text><path d="M80 896 H45 V540 H560" fill="none" stroke="#b27627" stroke-width="2" marker-end="url(#loop)"/>
    <path d="M760 970 V1010" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="780" y="996" fill="#367b68" font-size="14">是</text>
    <rect x="560" y="1010" width="400" height="112" fill="#edf4f7" stroke="#6798a8" stroke-width="2"/><text x="760" y="1047" text-anchor="middle" fill="#326d79" font-size="19" font-weight="700">规则模块：数据整理</text><text x="760" y="1076" text-anchor="middle" fill="#5d7680" font-size="14">输入：来源与原始记录</text><text x="760" y="1101" text-anchor="middle" fill="#5d7680" font-size="14">输出：标准字段与来源对应</text>
    <path d="M760 1122 V1160" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="1160" width="400" height="112" rx="20" fill="#e7f4f0" stroke="#3b9b83" stroke-width="2"/><text x="760" y="1197" text-anchor="middle" fill="#176a58" font-size="21" font-weight="700">Critic Agent</text><text x="760" y="1226" text-anchor="middle" fill="#4e716a" font-size="14">输入：标准数据与证据</text><text x="760" y="1251" text-anchor="middle" fill="#4e716a" font-size="14">输出：缺口、冲突清单</text>
    <path d="M960 1216 H1010" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="1203" fill="#367b68" font-size="14">检查</text>
    <polygon points="1150,1140 1290,1216 1150,1292 1010,1216" fill="#fff2dc" stroke="#c58528" stroke-width="2.3"/><text x="1150" y="1209" text-anchor="middle" fill="#8b5f20" font-size="20" font-weight="700">发现问题？</text><text x="1150" y="1237" text-anchor="middle" fill="#8b5f20" font-size="14">缺口、冲突</text>
    <path d="M1290 1216 H1510 V540 H960" fill="none" stroke="#b27627" stroke-width="2" marker-end="url(#loop)"/><text x="1320" y="1202" fill="#a16b25" font-size="14">是：交回检索</text><path d="M1150 1292 V1325" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="1170" y="1316" fill="#367b68" font-size="14">否</text>
    <rect x="1010" y="1325" width="400" height="112" rx="20" fill="#e7f4f0" stroke="#3b9b83" stroke-width="2"/><text x="1210" y="1362" text-anchor="middle" fill="#176a58" font-size="21" font-weight="700">Quality Agent</text><text x="1210" y="1391" text-anchor="middle" fill="#4e716a" font-size="14">输入：问题清单与质量指标</text><text x="1210" y="1416" text-anchor="middle" fill="#4e716a" font-size="14">输出：质量检查结果</text>
    <path d="M1210 1437 V1470" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="1210,1470 1350,1545 1210,1620 1070,1545" fill="#fff2dc" stroke="#c58528" stroke-width="2.3"/><text x="1210" y="1538" text-anchor="middle" fill="#8b5f20" font-size="18" font-weight="700">质量和医学安全</text><text x="1210" y="1565" text-anchor="middle" fill="#8b5f20" font-size="18" font-weight="700">通过？</text>
    <path d="M1070 1545 H1000 V1465 H980" fill="none" stroke="#b27627" stroke-width="2" marker-end="url(#loop)"/><text x="1018" y="1532" fill="#a16b25" font-size="14">否</text>
    <path d="M780 1420 H965 L980 1435 V1510 H780 Z" fill="#fff8ed" stroke="#c58528" stroke-width="1.8"/><path d="M965 1420 V1435 H980" fill="none" stroke="#c58528" stroke-width="1.8"/>
    <text x="880" y="1452" text-anchor="middle" fill="#8b5f20" font-size="17" font-weight="700">人工复核</text><text x="880" y="1477" text-anchor="middle" fill="#987440" font-size="12">输入：未通过结果</text><text x="880" y="1498" text-anchor="middle" fill="#987440" font-size="12">输出：确认意见</text>
    <path d="M1210 1620 V1580 H775" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="1230" y="1617" fill="#367b68" font-size="14">是</text>
    <path d="M480 1480 H760 L775 1495 V1605 H480 Z" fill="#eef8f4" stroke="#3b9b83" stroke-width="2"/><path d="M760 1480 V1495 H775" fill="none" stroke="#3b9b83" stroke-width="2"/><text x="627" y="1530" text-anchor="middle" fill="#176a58" font-size="20" font-weight="700">输出：科研数据交付包</text><text x="627" y="1559" text-anchor="middle" fill="#58756d" font-size="14">数据表、来源、字段说明、质量报告</text>
  </g>
</svg>
