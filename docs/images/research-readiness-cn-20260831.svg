<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#2563EB"/></marker><style>
  .title{font:700 42px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.sub{font:400 23px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.value{font:700 30px 'Microsoft YaHei','SimHei',sans-serif;fill:#1D4ED8}.head{font:700 25px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}.body{font:400 20px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}.strong{font:700 21px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F766E}.white{font:700 24px 'Microsoft YaHei','SimHei',sans-serif;fill:#fff}.note{font:400 19px 'Microsoft YaHei','SimHei',sans-serif;fill:#334155}
  </style></defs><rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="66" text-anchor="middle" class="title">数据适合做什么：规模、字段和研究条件必须一起判断</text>
  <text x="800" y="106" text-anchor="middle" class="sub">先解释每张表能够支持的分析，再判断它与最初问题之间还缺什么</text>
  <g>
    <rect x="90" y="150" width="270" height="120" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/><text x="225" y="197" text-anchor="middle" class="value">115 行</text><text x="225" y="239" text-anchor="middle" class="body">主数据表记录数</text>
    <rect x="390" y="150" width="270" height="120" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/><text x="525" y="197" text-anchor="middle" class="value">42 名</text><text x="525" y="239" text-anchor="middle" class="body">主数据表患者数</text>
    <rect x="690" y="150" width="270" height="120" rx="22" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/><text x="825" y="197" text-anchor="middle" class="value">31 列</text><text x="825" y="239" text-anchor="middle" class="body">主数据表字段数</text>
    <rect x="990" y="150" width="270" height="120" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/><text x="1125" y="197" text-anchor="middle" class="value">50 名</text><text x="1125" y="239" text-anchor="middle" class="body">GSE76360 患者数</text>
    <rect x="1290" y="150" width="220" height="120" rx="22" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="3"/><text x="1400" y="197" text-anchor="middle" class="value">48 条</text><text x="1400" y="239" text-anchor="middle" class="body">有效疗效记录</text>
  </g>
  <text x="100" y="332" class="head">每张表的适用范围</text>
  <g>
    <rect x="90" y="360" width="450" height="300" rx="26" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/><text x="315" y="410" text-anchor="middle" class="head">阿培利司治疗主数据表</text><text x="315" y="458" text-anchor="middle" class="body">同一患者组内同时具有</text><text x="315" y="494" text-anchor="middle" class="body">PIK3CA、样本、治疗和疗效</text><line x1="145" y1="528" x2="485" y2="528" stroke="#A7F3D0" stroke-width="2"/><text x="315" y="574" text-anchor="middle" class="strong">可用于：本组患者的</text><text x="315" y="610" text-anchor="middle" class="strong">PIK3CA—疗效关系分析</text>
    <rect x="575" y="360" width="450" height="300" rx="26" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/><text x="800" y="410" text-anchor="middle" class="head">GSE76360 补充数据表</text><text x="800" y="458" text-anchor="middle" class="body">HER2 阳性术前治疗患者</text><text x="800" y="494" text-anchor="middle" class="body">50 名患者中有 48 条有效疗效记录</text><line x1="630" y1="528" x2="970" y2="528" stroke="#BFDBFE" stroke-width="2"/><text x="800" y="574" text-anchor="middle" class="strong">可用于：疗效构成描述</text><text x="800" y="610" text-anchor="middle" class="strong">并定向补查同队列 PIK3CA</text>
    <rect x="1060" y="360" width="450" height="300" rx="26" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/><text x="1285" y="410" text-anchor="middle" class="head">METABRIC 与 TCGA 补充表</text><text x="1285" y="458" text-anchor="middle" class="body">分别提供独立研究中的</text><text x="1285" y="494" text-anchor="middle" class="body">临床和基因等分子资料</text><line x1="1115" y1="528" x2="1455" y2="528" stroke="#CBD5E1" stroke-width="2"/><text x="1285" y="574" text-anchor="middle" class="strong">可用于：各研究内独立描述</text><text x="1285" y="610" text-anchor="middle" class="strong">以及下一轮来源发现</text>
  </g>
  <path d="M800 682 V730" stroke="#2563EB" stroke-width="6" marker-end="url(#a)"/>
  <rect x="150" y="750" width="1300" height="104" rx="26" fill="#0F766E"/><text x="800" y="790" text-anchor="middle" class="white">最初问题还需要：同一 HER2 阳性术前治疗患者组同时具备 PIK3CA 与患者疗效</text><text x="800" y="827" text-anchor="middle" class="white" style="font-size:21px">因此当前先分别使用各表，并沿明确编号继续补查；不跨研究拼接患者。</text>
</svg>
