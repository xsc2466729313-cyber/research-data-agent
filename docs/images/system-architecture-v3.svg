<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">乳腺癌精准治疗科研数据智能体系统技术架构</title>
  <desc id="desc">展示交互层、智能体编排层、真实数据源层、数据治理层、科研输出层和全局安全约束。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowLayer"/>
      <feMerge><feMergeNode in="shadowLayer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.08" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowLayer"/>
      <feMerge><feMergeNode in="shadowLayer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563EB"/>
    </marker>
    <style>
      .zh { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0F172A; letter-spacing: 1px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #475569; }
      .layerNo { font-size: 17px; font-weight: 800; fill: #FFFFFF; letter-spacing: 1px; }
      .layerTitle { font-size: 25px; font-weight: 800; fill: #FFFFFF; }
      .boxTitle { font-size: 22px; font-weight: 800; fill: #0F172A; }
      .boxBody { font-size: 17px; font-weight: 500; fill: #475569; }
      .smallTitle { font-size: 19px; font-weight: 800; fill: #0F172A; }
      .smallBody { font-size: 15px; font-weight: 500; fill: #64748B; }
      .chip { font-size: 16px; font-weight: 700; fill: #334155; }
      .layerBand { stroke-width: 1.5; }
      .card { fill: #FFFFFF; stroke-width: 1.8; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1810" cy="95" r="180" fill="#DBEAFE" opacity="0.45"/>
  <circle cx="90" cy="1030" r="220" fill="#CCFBF1" opacity="0.32"/>

  <g class="zh">
    <text x="70" y="63" class="title">乳腺癌精准治疗科研数据智能体｜系统技术架构</text>
    <text x="72" y="99" class="subtitle">从科研问题到可追溯、可审计、可复用的患者 / 样本级科研数据</text>
    <g transform="translate(1395,42)">
      <rect x="0" y="0" width="124" height="34" rx="17" fill="#DBEAFE"/>
      <text x="62" y="23" text-anchor="middle" class="chip" fill="#1D4ED8">真实公开数据</text>
      <rect x="136" y="0" width="124" height="34" rx="17" fill="#CCFBF1"/>
      <text x="198" y="23" text-anchor="middle" class="chip" fill="#0F766E">同研究内对齐</text>
      <rect x="272" y="0" width="124" height="34" rx="17" fill="#EDE9FE"/>
      <text x="334" y="23" text-anchor="middle" class="chip" fill="#6D28D9">字段级证据</text>
      <rect x="408" y="0" width="124" height="34" rx="17" fill="#FFEDD5"/>
      <text x="470" y="23" text-anchor="middle" class="chip" fill="#C2410C">质量门闭环</text>
    </g>

    <!-- Layer 01 -->
    <rect x="48" y="130" width="1824" height="120" rx="20" fill="#EFF6FF" stroke="#BFDBFE" class="layerBand"/>
    <rect x="66" y="145" width="210" height="90" rx="18" fill="#2563EB" filter="url(#softShadow)"/>
    <text x="90" y="177" class="layerNo">LAYER 01</text>
    <text x="90" y="212" class="layerTitle">交互与接入层</text>

    <g filter="url(#softShadow)">
      <rect x="310" y="151" width="470" height="78" rx="15" class="card" stroke="#93C5FD"/>
      <rect x="805" y="151" width="470" height="78" rx="15" class="card" stroke="#93C5FD"/>
      <rect x="1300" y="151" width="530" height="78" rx="15" class="card" stroke="#93C5FD"/>
    </g>
    <circle cx="345" cy="190" r="20" fill="#DBEAFE"/><text x="345" y="197" text-anchor="middle" class="smallTitle" fill="#2563EB">1</text>
    <text x="380" y="183" class="boxTitle">科研人员</text><text x="380" y="211" class="boxBody">自然语言问题 · 高级筛选 · 文件输入</text>
    <circle cx="840" cy="190" r="20" fill="#DBEAFE"/><text x="840" y="197" text-anchor="middle" class="smallTitle" fill="#2563EB">2</text>
    <text x="875" y="183" class="boxTitle">中文科研工作台</text><text x="875" y="211" class="boxBody">任务进度 · 数据表 · 证据溯源 · API 交互</text>
    <circle cx="1335" cy="190" r="20" fill="#DBEAFE"/><text x="1335" y="197" text-anchor="middle" class="smallTitle" fill="#2563EB">3</text>
    <text x="1370" y="183" class="boxTitle">REST API 与临时千问会话</text><text x="1370" y="211" class="boxBody">FastAPI · 会话密钥仅驻内存 · HTTPS 部署边界</text>

    <path d="M780 190 H797" class="flow"/>
    <path d="M1275 190 H1292" class="flow"/>

    <!-- Layer 02 -->
    <rect x="48" y="264" width="1824" height="154" rx="20" fill="#F5F3FF" stroke="#DDD6FE" class="layerBand"/>
    <rect x="66" y="291" width="210" height="100" rx="18" fill="#7C3AED" filter="url(#softShadow)"/>
    <text x="90" y="326" class="layerNo">LAYER 02</text>
    <text x="90" y="362" class="layerTitle">智能体编排层</text>

    <g filter="url(#softShadow)">
      <rect x="310" y="286" width="278" height="110" rx="15" class="card" stroke="#C4B5FD"/>
      <rect x="610" y="286" width="278" height="110" rx="15" class="card" stroke="#C4B5FD"/>
      <rect x="910" y="286" width="278" height="110" rx="15" class="card" stroke="#C4B5FD"/>
      <rect x="1210" y="286" width="278" height="110" rx="15" class="card" stroke="#C4B5FD"/>
      <rect x="1510" y="286" width="320" height="110" rx="15" class="card" stroke="#C4B5FD"/>
    </g>
    <text x="449" y="324" text-anchor="middle" class="smallTitle">Research Parser</text>
    <text x="449" y="351" text-anchor="middle" class="smallBody">PICO / 实体 / 目标字段</text>
    <text x="449" y="376" text-anchor="middle" class="smallBody">→ ResearchSpec</text>
    <text x="749" y="324" text-anchor="middle" class="smallTitle">千问 Function Calling</text>
    <text x="749" y="351" text-anchor="middle" class="smallBody">工具选择与受约束总结</text>
    <text x="749" y="376" text-anchor="middle" class="smallBody">确定性规划可兜底</text>
    <text x="1049" y="324" text-anchor="middle" class="smallTitle">研究设计与队列构建</text>
    <text x="1049" y="351" text-anchor="middle" class="smallBody">暴露 / 结局 / 协变量</text>
    <text x="1049" y="376" text-anchor="middle" class="smallBody">患者 / 样本锚定</text>
    <text x="1349" y="324" text-anchor="middle" class="smallTitle">Goal Loop</text>
    <text x="1349" y="351" text-anchor="middle" class="smallBody">观察 → 诊断 → 换方法</text>
    <text x="1349" y="376" text-anchor="middle" class="smallBody">轮次与尝试历史受控</text>
    <text x="1670" y="324" text-anchor="middle" class="smallTitle">任务服务与状态机</text>
    <text x="1670" y="351" text-anchor="middle" class="smallBody">计划 / 执行 / 进度 / 审计</text>
    <text x="1670" y="376" text-anchor="middle" class="smallBody">PASS · PARTIAL · REVIEW</text>

    <path d="M588 341 H602" class="flow"/><path d="M888 341 H902" class="flow"/>
    <path d="M1188 341 H1202" class="flow"/><path d="M1488 341 H1502" class="flow"/>

    <!-- Layer 03 -->
    <rect x="48" y="432" width="1824" height="148" rx="20" fill="#ECFEFF" stroke="#A5F3FC" class="layerBand"/>
    <rect x="66" y="456" width="210" height="100" rx="18" fill="#0891B2" filter="url(#softShadow)"/>
    <text x="90" y="491" class="layerNo">LAYER 03</text>
    <text x="90" y="527" class="layerTitle">真实数据源层</text>

    <rect x="310" y="454" width="210" height="104" rx="15" fill="#0E7490" filter="url(#softShadow)"/>
    <text x="415" y="493" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">Tool Router</text>
    <text x="415" y="522" text-anchor="middle" font-size="15" font-weight="600" fill="#CFFAFE">检索 · 验真 · 限量获取</text>
    <text x="415" y="546" text-anchor="middle" font-size="15" font-weight="600" fill="#CFFAFE">失败回退与来源登记</text>

    <g filter="url(#softShadow)">
      <rect x="550" y="454" width="230" height="104" rx="15" class="card" stroke="#67E8F9"/>
      <rect x="800" y="454" width="230" height="104" rx="15" class="card" stroke="#67E8F9"/>
      <rect x="1050" y="454" width="230" height="104" rx="15" class="card" stroke="#67E8F9"/>
      <rect x="1300" y="454" width="230" height="104" rx="15" class="card" stroke="#67E8F9"/>
      <rect x="1550" y="454" width="280" height="104" rx="15" class="card" stroke="#67E8F9"/>
    </g>
    <text x="665" y="494" text-anchor="middle" class="smallTitle">GDC / TCGA-BRCA</text><text x="665" y="525" text-anchor="middle" class="smallBody">临床 · 突变 · 组学</text>
    <text x="915" y="494" text-anchor="middle" class="smallTitle">NCBI GEO</text><text x="915" y="525" text-anchor="middle" class="smallBody">表达 · 治疗响应队列</text>
    <text x="1165" y="494" text-anchor="middle" class="smallTitle">cBioPortal</text><text x="1165" y="525" text-anchor="middle" class="smallBody">癌症队列 · 基因组</text>
    <text x="1415" y="494" text-anchor="middle" class="smallTitle">ClinicalTrials.gov</text><text x="1415" y="525" text-anchor="middle" class="smallBody">临床试验关系表</text>
    <text x="1690" y="494" text-anchor="middle" class="smallTitle">CIViC</text><text x="1690" y="525" text-anchor="middle" class="smallBody">Variant · Drug · Evidence</text>
    <path d="M520 506 H535 V442 H1690" fill="none" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M665 442 V449" class="flow"/><path d="M915 442 V449" class="flow"/>
    <path d="M1165 442 V449" class="flow"/><path d="M1415 442 V449" class="flow"/>
    <path d="M1690 442 V449" class="flow"/>

    <!-- Layer 04 -->
    <rect x="48" y="594" width="1824" height="184" rx="20" fill="#F0FDF4" stroke="#BBF7D0" class="layerBand"/>
    <rect x="66" y="636" width="210" height="100" rx="18" fill="#0F766E" filter="url(#softShadow)"/>
    <text x="90" y="671" class="layerNo">LAYER 04</text>
    <text x="90" y="707" class="layerTitle">处理与治理层</text>

    <g filter="url(#softShadow)">
      <rect x="310" y="620" width="280" height="132" rx="16" class="card" stroke="#86EFAC"/>
      <rect x="610" y="620" width="280" height="132" rx="16" class="card" stroke="#86EFAC"/>
      <rect x="910" y="620" width="280" height="132" rx="16" class="card" stroke="#86EFAC"/>
      <rect x="1210" y="620" width="280" height="132" rx="16" class="card" stroke="#86EFAC"/>
      <rect x="1510" y="620" width="320" height="132" rx="16" class="card" stroke="#86EFAC"/>
    </g>
    <text x="450" y="659" text-anchor="middle" class="smallTitle">获取、解析与原始审计</text>
    <text x="450" y="688" text-anchor="middle" class="smallBody">JSON / 表格 / Series Matrix</text>
    <text x="450" y="715" text-anchor="middle" class="smallBody">source_id · raw_field · raw_value</text>
    <text x="750" y="659" text-anchor="middle" class="smallTitle">医学标准化</text>
    <text x="750" y="688" text-anchor="middle" class="smallBody">Gene / Drug / Biomarker</text>
    <text x="750" y="715" text-anchor="middle" class="smallBody">冻结 Canonical Schema 对齐</text>
    <text x="1050" y="659" text-anchor="middle" class="smallTitle">实体对齐与同研究融合</text>
    <text x="1050" y="688" text-anchor="middle" class="smallBody">patient_id / sample_id 命名空间</text>
    <text x="1050" y="715" text-anchor="middle" class="smallBody">低置信度 → unresolved</text>
    <text x="1350" y="659" text-anchor="middle" class="smallTitle">Evidence 与冲突处理</text>
    <text x="1350" y="688" text-anchor="middle" class="smallBody">字段级来源 · 高权威冲突</text>
    <text x="1350" y="715" text-anchor="middle" class="smallBody">确定性 Repair · 人工 Review</text>
    <text x="1670" y="659" text-anchor="middle" class="smallTitle">四层 Quality Gate</text>
    <text x="1670" y="688" text-anchor="middle" class="smallBody">身份 · 结局域 · 分子覆盖 · 证据</text>
    <text x="1670" y="715" text-anchor="middle" class="smallBody">不满足则诊断缺口并换方法</text>
    <path d="M590 686 H602" class="flow"/><path d="M890 686 H902" class="flow"/>
    <path d="M1190 686 H1202" class="flow"/><path d="M1490 686 H1502" class="flow"/>

    <!-- Layer 05 -->
    <rect x="48" y="792" width="1824" height="176" rx="20" fill="#FFF7ED" stroke="#FED7AA" class="layerBand"/>
    <rect x="66" y="830" width="210" height="100" rx="18" fill="#D97706" filter="url(#softShadow)"/>
    <text x="90" y="865" class="layerNo">LAYER 05</text>
    <text x="90" y="901" class="layerTitle">科研输出层</text>

    <g filter="url(#softShadow)">
      <rect x="310" y="817" width="350" height="126" rx="16" class="card" stroke="#FDBA74"/>
      <rect x="685" y="817" width="350" height="126" rx="16" class="card" stroke="#FDBA74"/>
      <rect x="1060" y="817" width="350" height="126" rx="16" class="card" stroke="#FDBA74"/>
      <rect x="1435" y="817" width="395" height="126" rx="16" class="card" stroke="#FDBA74"/>
    </g>
    <text x="485" y="857" text-anchor="middle" class="smallTitle">科研数据包</text>
    <text x="485" y="886" text-anchor="middle" class="smallBody">Canonical Dataset · 分析矩阵</text>
    <text x="485" y="913" text-anchor="middle" class="smallBody">数据字典 · 队列漏斗</text>
    <text x="860" y="857" text-anchor="middle" class="smallTitle">可追溯证据包</text>
    <text x="860" y="886" text-anchor="middle" class="smallBody">Evidence JSONL · Source Manifest</text>
    <text x="860" y="913" text-anchor="middle" class="smallBody">修复记录 · 原始值审计</text>
    <text x="1235" y="857" text-anchor="middle" class="smallTitle">质量与评测</text>
    <text x="1235" y="886" text-anchor="middle" class="smallBody">完整率 · 适用性 · Traceability</text>
    <text x="1235" y="913" text-anchor="middle" class="smallBody">有真实 Gold Set 才计算 SDTI</text>
    <text x="1632" y="857" text-anchor="middle" class="smallTitle">交付与复用</text>
    <text x="1632" y="886" text-anchor="middle" class="smallBody">CSV · Parquet · Excel · HTML</text>
    <text x="1632" y="913" text-anchor="middle" class="smallBody">前端查看 · REST API · 下载</text>

    <!-- Vertical information flow -->
    <path d="M1845 250 V258" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
    <path d="M1845 418 V426" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
    <path d="M1845 580 V588" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
    <path d="M1845 778 V786" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

    <!-- Cross-cutting constraints -->
    <rect x="48" y="984" width="1824" height="70" rx="18" fill="#0F172A" filter="url(#shadow)"/>
    <text x="78" y="1027" font-size="20" font-weight="800" fill="#FFFFFF">全局硬约束</text>
    <line x1="220" y1="1000" x2="220" y2="1038" stroke="#475569" stroke-width="2"/>
    <g class="chip">
      <rect x="246" y="1001" width="260" height="36" rx="18" fill="#1E3A8A"/><text x="376" y="1025" text-anchor="middle" fill="#DBEAFE">冻结 Canonical Schema</text>
      <rect x="524" y="1001" width="250" height="36" rx="18" fill="#134E4A"/><text x="649" y="1025" text-anchor="middle" fill="#CCFBF1">保留真实来源与原始值</text>
      <rect x="792" y="1001" width="250" height="36" rx="18" fill="#4C1D95"/><text x="917" y="1025" text-anchor="middle" fill="#EDE9FE">医学安全规则不可覆盖</text>
      <rect x="1060" y="1001" width="300" height="36" rx="18" fill="#7C2D12"/><text x="1210" y="1025" text-anchor="middle" fill="#FFEDD5">不同响应域不混合解释</text>
      <rect x="1378" y="1001" width="450" height="36" rx="18" fill="#7F1D1D"/><text x="1603" y="1025" text-anchor="middle" fill="#FEE2E2">不跨库拼患者 · 不伪造来源、结论与成绩</text>
    </g>
  </g>
</svg>
