<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1D4ED8"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .title{font:700 42px 'Microsoft YaHei','SimHei',sans-serif;fill:#0B2F6B}
      .subtitle{font:400 22px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}
      .h1{font:700 25px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
      .h2{font:700 21px 'Microsoft YaHei','SimHei',sans-serif;fill:#0F172A}
      .body{font:400 18px 'Microsoft YaHei','SimHei',sans-serif;fill:#334155}
      .small{font:400 16px 'Microsoft YaHei','SimHei',sans-serif;fill:#475569}
      .white{fill:#FFFFFF}
      .flow{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrow-blue)}
      .join{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow-gray)}
      .merge{fill:none;stroke:#475569;stroke-width:2.2}
      .line{fill:none;stroke:#94A3B8;stroke-width:2}
      .label{font:700 17px 'Microsoft YaHei','SimHei',sans-serif;fill:#1D4ED8}
    </style>
  </defs>

  <rect width="1600" height="1540" fill="#FFFFFF"/>
  <text x="800" y="58" text-anchor="middle" class="title">乳腺癌科研数据智能体在线评测与指标计算流程</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">同一套评测输入，分别检验问题解析、真实网站取数、字段整理、错误识别与发布安全</text>

  <rect x="610" y="120" width="380" height="54" rx="27" fill="#E8F0FF" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="800" y="155" text-anchor="middle" class="h2">冻结本轮评测输入</text>
  <path d="M800 174 V196" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="70" y="200" width="1460" height="188" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="70" y="200" width="1460" height="48" rx="24" fill="#0B3B82"/>
    <rect x="70" y="224" width="1460" height="24" fill="#0B3B82"/>
    <text x="800" y="233" text-anchor="middle" class="h1 white">评测输入由三类审核样本和一组研究问题构成</text>

    <rect x="100" y="270" width="325" height="92" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="262" y="304" text-anchor="middle" class="h2">11 个研究问题</text>
    <text x="262" y="336" text-anchor="middle" class="body">运行时只向系统提供问题文本</text>

    <rect x="458" y="270" width="325" height="92" rx="16" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
    <text x="620" y="304" text-anchor="middle" class="h2">50 条来源判断</text>
    <text x="620" y="336" text-anchor="middle" class="body">18 条相关，32 条不相关</text>

    <rect x="816" y="270" width="325" height="92" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <text x="978" y="304" text-anchor="middle" class="h2">26 条关键字段样本</text>
    <text x="978" y="336" text-anchor="middle" class="body">核对标准字段、标准值与证据</text>

    <rect x="1174" y="270" width="325" height="92" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="1336" y="304" text-anchor="middle" class="h2">18 条错误判断样本</text>
    <text x="1336" y="336" text-anchor="middle" class="body">15 条错误，3 条正常对照</text>
  </g>

  <path d="M800 388 V416" class="flow"/>
  <polygon points="800,416 1010,478 800,540 590,478" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <text x="800" y="470" text-anchor="middle" class="h2">本轮是否实际调用千问</text>
  <text x="800" y="500" text-anchor="middle" class="body">完成问题解析与来源规划？</text>

  <path d="M590 478 H430 V566" class="flow"/>
  <text x="495" y="461" text-anchor="middle" class="label">是</text>
  <path d="M1010 478 H1170 V566" class="flow"/>
  <text x="1105" y="461" text-anchor="middle" class="label">否</text>

  <g filter="url(#shadow)">
    <rect x="160" y="570" width="540" height="112" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="430" y="610" text-anchor="middle" class="h2">严格千问在线完整链路</text>
    <text x="430" y="642" text-anchor="middle" class="body">千问解析与规划 → 官方网站实时取数</text>
    <text x="430" y="668" text-anchor="middle" class="small">用于评价“模型规划 + 数据链”的整体表现</text>

    <rect x="900" y="570" width="540" height="112" rx="20" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
    <text x="1170" y="610" text-anchor="middle" class="h2">在线数据链开发复测</text>
    <text x="1170" y="642" text-anchor="middle" class="body">固定规划 → 官方网站实时取数</text>
    <text x="1170" y="668" text-anchor="middle" class="small">只检验网站接口和确定性处理规则</text>
  </g>

  <path d="M430 682 V714 H800" class="merge"/>
  <path d="M1170 682 V714 H800" class="merge"/>
  <path d="M800 714 V722" class="join"/>
  <rect x="460" y="726" width="680" height="94" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
  <text x="800" y="765" text-anchor="middle" class="h2">重新访问官方公开网站并登记本次运行证据</text>
  <text x="800" y="795" text-anchor="middle" class="body">记录返回来源编号、关键字段、原值、来源地址与处理日志；不读取本地缓存</text>

  <path d="M800 820 V850 H290 V874" class="flow"/>
  <path d="M800 850 V874" class="flow"/>
  <path d="M800 850 H1310 V874" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="55" y="878" width="470" height="196" rx="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
    <text x="290" y="917" text-anchor="middle" class="h2">来源检索评分</text>
    <text x="85" y="953" class="body">逐条比较“问题—来源”是否返回：</text>
    <text x="85" y="986" class="body">正确找回 TP＝18；错误返回 FP＝1</text>
    <text x="85" y="1019" class="body">遗漏 FN＝0；正常未返回 TN＝31</text>
    <text x="85" y="1051" class="small">计算：精确率、召回率、检索综合值</text>

    <rect x="565" y="878" width="470" height="196" rx="20" fill="#ECFDF5" stroke="#34D399" stroke-width="2.5"/>
    <text x="800" y="917" text-anchor="middle" class="h2">字段与来源评分</text>
    <text x="595" y="953" class="body">26 条字段逐条核对：</text>
    <text x="595" y="986" class="body">标准字段和值与审核答案一致：26/26</text>
    <text x="595" y="1019" class="body">有效证据、原字段和来源完整：26/26</text>
    <text x="595" y="1051" class="small">计算：字段忠实度、来源可追溯率</text>

    <rect x="1075" y="878" width="470" height="196" rx="20" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.5"/>
    <text x="1310" y="917" text-anchor="middle" class="h2">错误识别与修复评分</text>
    <text x="1105" y="953" class="body">15 条错误全部检出，3 条正常均未误报</text>
    <text x="1105" y="986" class="body">错误 TP＝15，FP＝0，FN＝0</text>
    <text x="1105" y="1019" class="body">3 条低风险自动修复均与审核答案一致</text>
    <text x="1105" y="1051" class="small">计算：错误综合值、自动修复正确率</text>
  </g>

  <path d="M290 1074 V1104 H800" class="merge"/>
  <path d="M800 1074 V1104" class="merge"/>
  <path d="M1310 1074 V1104 H800" class="merge"/>
  <path d="M800 1104 V1114" class="join"/>

  <rect x="390" y="1118" width="820" height="112" rx="20" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="800" y="1158" text-anchor="middle" class="h2">计算科研数据可信整合指数，并独立执行安全门检查</text>
  <text x="800" y="1191" text-anchor="middle" class="body">SDTI＝100 ×（检索综合值 × 忠实度 × 可追溯率 × 错误综合值 × 修复正确率）的五次方根</text>
  <text x="800" y="1217" text-anchor="middle" class="small">同时检查虚假来源、关键证据、高风险问题、质量门状态和题集是否封存</text>

  <path d="M800 1230 V1254" class="flow"/>
  <polygon points="800,1254 1010,1314 800,1374 590,1314" fill="#FFF1F2" stroke="#BE123C" stroke-width="2.5"/>
  <text x="800" y="1306" text-anchor="middle" class="h2">题集已独立封存且</text>
  <text x="800" y="1337" text-anchor="middle" class="body">全部安全门通过？</text>

  <path d="M590 1314 H430 V1392" class="flow"/>
  <text x="500" y="1297" text-anchor="middle" class="label">否</text>
  <path d="M1010 1314 H1170 V1392" class="flow"/>
  <text x="1100" y="1297" text-anchor="middle" class="label">是</text>

  <rect x="160" y="1396" width="540" height="102" rx="20" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <text x="430" y="1438" text-anchor="middle" class="h2">开发观察或候选测试结果</text>
  <text x="430" y="1471" text-anchor="middle" class="body">保留报告与审计记录，但禁止自动发布</text>

  <rect x="900" y="1396" width="540" height="102" rx="20" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
  <text x="1170" y="1438" text-anchor="middle" class="h2">独立封存测试结果</text>
  <text x="1170" y="1471" text-anchor="middle" class="body">形成可复现正式成绩并保存完整审计产物</text>
</svg>
